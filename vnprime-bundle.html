/* ==========================================================================

@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

:root {
  /* ---------- Brand base ---------- */
  --navy:            #0F2244;   /* Marinha — primary brand */
  --navy-soft:       #162A52;
  --navy-muted:      #1E3560;
  --gold:            #C9960E;   /* Dourado — accent */
  --gold-soft:       #D4A84A;
  --gold-bright:     #F5D78E;   /* gradient highlight */
  --gold-deep:       #A07830;   /* gradient shadow */

  /* ---------- Surfaces ---------- */
  --cream:           #FAF8F4;   /* off-white page bg */
  --white:           #FFFFFF;
  --surface:         #FFFFFF;
  --surface-alt:     #FAF8F4;

  /* ---------- Text ---------- */
  --fg-1:            #1A1A1A;   /* body */
  --fg-2:            #5C6478;   /* muted, secondary */
  --fg-3:            rgba(15, 34, 68, 0.55);
  --fg-on-navy:      #FAF8F4;
  --fg-on-navy-2:    rgba(250, 249, 246, 0.85);

  /* ---------- Borders ---------- */
  --border:          rgba(15, 34, 68, 0.12);
  --border-strong:   rgba(15, 34, 68, 0.22);

  /* ---------- Profile accents (adaptive UI) ---------- */
  --profile-owner:   #C9960E;   /* Proprietário — Ouro */
  --profile-broker:  #059669;   /* Corretor — Esmeralda */
  --profile-photo:   #B87333;   /* Fotógrafo — Bronze */
  --profile-admin:   #0F2244;   /* Administração — Marinho */

  /* ---------- Semantic status ---------- */
  --status-pending-bg:     #FEF3C7;
  --status-pending-fg:     #92400E;
  --status-approved-bg:    #D1FAE5;
  --status-approved-fg:    #065F46;
  --status-plan-bg:        #E0E7FF;
  --status-plan-fg:        #3730A3;

  /* ---------- Elevation ---------- */
  --shadow-card:     0 8px 32px rgba(15, 34, 68, 0.08);
  --shadow-soft:     0 18px 50px rgba(15, 34, 68, 0.12);
  --shadow-accent:   0 4px 24px rgba(201, 150, 14, 0.35);
  --shadow-navy:     0 4px 20px rgba(15, 34, 68, 0.25);
  --shadow-featured: 0 12px 40px rgba(201, 150, 14, 0.20);

  /* ---------- Radii ---------- */
  --radius-sm:       8px;
  --radius-md:       14px;
  --radius-lg:       22px;
  --radius-pill:     999px;

  /* ---------- Spacing scale ---------- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 2.5rem;
  --space-8: 3rem;

  /* ---------- Type families ---------- */
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:    "DM Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --font-brand:   "Cinzel", Georgia, serif;   /* VN PRIME wordmark only */

  /* ---------- Signature gradients ---------- */
  --gradient-gold:       linear-gradient(145deg,#F5D78E 0%,#C9A84C 45%,#A07830 62%,#C9A84C 100%);
  --gradient-gold-line:  linear-gradient(90deg,#B8892A,#D4A84A,#B8892A);
  --gradient-navy-hero:  linear-gradient(135deg,#0F2244 0%,#162A52 45%,#1E3560 100%);
  --gradient-navy-fact:  linear-gradient(90deg,#0F2244,#1E3560);

  /* ---------- Dynamic accent (profile-adaptive) ---------- */
  --accent:          var(--gold);
  --accent-contrast: var(--navy);
}

[data-profile="owner"]  { --accent: var(--profile-owner);  --accent-contrast: #0F2244; }
[data-profile="broker"] { --accent: var(--profile-broker); --accent-contrast: #FFFFFF; }
[data-profile="photo"]  { --accent: var(--profile-photo);  --accent-contrast: #0F2244; }
[data-profile="admin"]  { --accent: var(--profile-admin);  --accent-contrast: #C9960E; }

/* ============================================================
   Semantic type styles
   ============================================================ */

html { color-scheme: light; }

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--fg-1);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.2;
  color: var(--navy);
  margin: 0 0 0.5em;
}

h1 { font-size: clamp(2.25rem, 4vw, 3.25rem); }
h2 { font-size: clamp(1.75rem, 3vw, 2.35rem); }
h3 { font-size: 1.35rem; }
h4 { font-size: 1.1rem; }

p { margin: 0 0 1em; color: var(--fg-2); }

small, .text-xs { font-size: 0.75rem; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-soft);
}

.subsection-label {
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.label-caps {
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-2);
}

.lead {
  font-family: var(--font-body);
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--fg-2);
}

.price {
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--accent);
  margin: 0.5rem 0;
}

.muted { color: var(--fg-2); }

code {
  font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
  background: rgba(15, 34, 68, 0.06);
  padding: 0.1em 0.35em;
  border-radius: 4px;
}

/* Brand wordmark helper — VN PRIME only */
.wordmark-vn {
  font-family: var(--font-brand);
  font-weight: 700;
  letter-spacing: 0.05em;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.wordmark-prime {
  font-family: var(--font-brand);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--navy);
}

  font-family: var(--font-body);

  text-transform: uppercase;
  background: var(--gradient-gold-line);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

// ── Gerador de pitches VN Prime (template-based, funciona sem backend) ────────
window.claude = {
  complete: function(prompt) {
    return new Promise(function(resolve) {
      // Extrai dados do prompt
      var tipo      = (prompt.match(/Tipo:\s*(.+)/)       || [])[1] || 'Imóvel';
      var bairro    = (prompt.match(/Localização:\s*([^,\n]+)/) || [])[1]?.trim() || 'Belo Horizonte';
      var area      = (prompt.match(/Área:\s*(\d+)/)      || [])[1] || '';
      var quartos   = (prompt.match(/(\d+) quartos/)      || [])[1] || '';
      var suites    = (prompt.match(/(\d+) suítes/)       || [])[1] || '';
      var vagas     = (prompt.match(/(\d+) vagas/)        || [])[1] || '';
      var difRaw    = (prompt.match(/Diferenciais:\s*(.+)/) || [])[1] || '';
      var difs      = difRaw !== 'não informado' ? difRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
      var difStr    = difs.length ? difs.slice(0, 2).join(' e ').toLowerCase() : '';

      var areaStr   = area   ? area + ' m²'      : '';
      var qtosStr   = quartos ? quartos + (quartos === '1' ? ' quarto' : ' quartos') : '';
      var suitStr   = suites  ? suites  + (suites  === '1' ? ' suíte'  : ' suítes')  : '';
      var vagStr    = vagas   ? vagas   + (vagas   === '1' ? ' vaga'   : ' vagas')   : '';

      var specs = [areaStr, qtosStr, suitStr, vagStr].filter(Boolean).join(', ');

      var pitches = [
        {
          label: 'Curto e direto',
          text: tipo + ' de ' + (areaStr || 'alto padrão') + ' no ' + bairro + (specs ? ' — ' + specs : '') + '.' +
            (difStr ? ' Destaques: ' + difStr + '.' : '') +
            ' Curadoria VN Prime. Endereço completo disponível após contato qualificado.'
        },
        {
          label: 'Editorial e descritivo',
          text: 'Localizado no ' + bairro + ', este ' + tipo.toLowerCase() + (areaStr ? ' de ' + areaStr : '') +
            ' foi projetado para quem valoriza espaço e qualidade de acabamento.' +
            (specs ? ' São ' + [qtosStr, suitStr, vagStr].filter(Boolean).join(', ') + '.' : '') +
            (difStr ? ' Entre os diferenciais: ' + difStr + '.' : '') +
            ' Disponibilidade e visita mediante agendamento pelo portal VN Prime.'
        },
        {
          label: 'Foco em estilo de vida',
          text: bairro + ' é um dos bairros mais valorizados de BH — e este ' + tipo.toLowerCase() +
            (areaStr ? ' de ' + areaStr : '') + ' está no coração dele.' +
            (difStr ? ' ' + difStr.charAt(0).toUpperCase() + difStr.slice(1) + ' fazem parte do dia a dia.' : '') +
            (qtosStr ? ' ' + qtosStr.charAt(0).toUpperCase() + qtosStr.slice(1) + (suitStr ? ', sendo ' + suitStr : '') + '.' : '') +
            ' Para quem busca referência sem abrir mão de conforto.'
        }
      ];

      // Simula delay realista de 2.5s
      setTimeout(function() {
        resolve(JSON.stringify({ pitches: pitches }));
      }, 2500);
    });
  }
};
</script>

<body>
<div id="root"></div>

<script type="text/babel">
// Shared chrome — header, footer, brand mark, buttons, pills, formatters
const { useState, useEffect, useRef, useMemo } = React;

const fmtBRL = (n) => 'R$ ' + new Intl.NumberFormat('pt-BR').format(n);
const fmtBRLshort = (n) => {
  if (n >= 1_000_000) return 'R$ ' + (n / 1_000_000).toFixed(n % 1_000_000 === 0 ? 0 : 1).replace('.', ',') + ' mi';
  if (n >= 1_000) return 'R$ ' + Math.round(n / 1_000) + ' mil';
  return fmtBRL(n);
};

function ShieldMark({ size = 28 }) {
  return (
    <svg width={size} height={size * 1.13} viewBox="0 0 44 50" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="goldShield" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#F5D78E"/>
          <stop offset="45%" stopColor="#C9A84C"/>
          <stop offset="62%" stopColor="#A07830"/>
          <stop offset="100%" stopColor="#C9A84C"/>
        </linearGradient>
      </defs>
      <path d="M22 1 L42 6 V24 C42 36 33 45 22 49 C11 45 2 36 2 24 V6 Z"
        stroke="url(#goldShield)" strokeWidth="2.2" fill="rgba(201,150,14,0.05)"/>
      <text x="22" y="32" textAnchor="middle"
        fontFamily="Cinzel, serif" fontSize="18" fontWeight="700"
        fill="url(#goldShield)" letterSpacing="0.03em">VN</text>
    </svg>
  );
}

function BrandLockup({ onNavy = false }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <ShieldMark size={32} />
      <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1 }}>
        <span style={{ fontFamily: 'Cinzel, serif', fontWeight: 700, fontSize: 18, letterSpacing: '0.14em',
          color: onNavy ? '#fff' : 'var(--navy)' }}>VN PRIME</span>
        <span style={{ fontFamily: 'DM Sans', fontWeight: 600, fontSize: 9, letterSpacing: '0.42em',
          background: 'linear-gradient(90deg,#B8892A,#D4A84A,#B8892A)',
          WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent', marginTop: 4 }}>IMÓVEIS</span>
      </div>
    </div>
  );
}

function Btn({ variant = 'primary', size = 'md', children, onClick, type, style = {}, fullWidth = false }) {
  const sizes = {
    md: { padding: '0.75rem 1.35rem', fontSize: 14 },
    sm: { padding: '0.5rem 0.95rem', fontSize: 12.5 },
    lg: { padding: '0.95rem 1.7rem', fontSize: 15 },
    xs: { padding: '0.35rem 0.7rem', fontSize: 11.5 },
  };
  const variants = {
    primary: { background: 'var(--navy)', color: 'var(--cream)', boxShadow: '0 4px 20px rgba(15,34,68,0.25)' },
    accent:  { background: 'var(--gold)', color: 'var(--navy)', boxShadow: '0 4px 24px rgba(201,150,14,0.35)', fontWeight: 700 },
    ghost:   { background: 'transparent', color: 'var(--navy)', border: '1px solid var(--border-strong)' },
    ghostOnNavy: { background: 'rgba(255,255,255,0.06)', color: '#fff', border: '1px solid rgba(250,249,246,0.4)' },
    text:    { background: 'transparent', color: 'var(--navy)', boxShadow: 'none' },
  };
  return (
    <button
      type={type || 'button'}
      onClick={onClick}
      style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        fontFamily: 'DM Sans, sans-serif', fontWeight: 600, border: 'none', cursor: 'pointer',
        borderRadius: 8, transition: 'transform 0.15s ease, box-shadow 0.2s, background 0.2s, filter 0.2s',
        width: fullWidth ? '100%' : undefined,
        ...sizes[size], ...variants[variant], ...style,
      }}
      onMouseEnter={(e) => { e.currentTarget.style.filter = 'brightness(1.04)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.filter = 'none'; }}
      onMouseDown={(e) => { e.currentTarget.style.transform = 'scale(0.98)'; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
    >{children}</button>
  );
}

function Eyebrow({ children, color }) {
  return (
    <div style={{ fontFamily: 'DM Sans', fontSize: 11.5, fontWeight: 700,
      letterSpacing: '0.14em', textTransform: 'uppercase', color: color || 'var(--gold-soft)',
      marginBottom: 10 }}>{children}</div>
  );
}

// ImovelWeb-style operation tabs (Comprar / Alugar / Lançamentos)
function OperationTabs({ value, onChange }) {
  const tabs = [
    { id: 'compra', label: 'Comprar' },
    { id: 'lancamento', label: 'Lançamentos' },
  ];
  return (
    <div style={{ display: 'inline-flex', background: 'rgba(15,34,68,0.55)',
      borderRadius: 10, padding: 4, gap: 2, border: '1px solid rgba(255,255,255,0.12)' }}>
      {tabs.map(t => {
        const active = value === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            style={{
              fontFamily: 'DM Sans', fontSize: 13, fontWeight: 600,
              padding: '0.55rem 1.1rem', borderRadius: 7, cursor: 'pointer', border: 'none',
              background: active ? 'var(--gold)' : 'transparent',
              color: active ? 'var(--navy)' : 'rgba(250,249,246,0.85)',
              letterSpacing: '0.02em',
              transition: 'background 0.15s ease, color 0.15s ease',
            }}>{t.label}</button>
        );
      })}
    </div>
  );
}

function Pill({ children, tone = 'gold', solid = false, style = {} }) {
  const tones = {
    gold: { bg: solid ? 'var(--gold)' : 'rgba(201,150,14,0.15)', fg: solid ? 'var(--navy)' : 'var(--navy)' },
    navy: { bg: solid ? 'var(--navy)' : 'rgba(15,34,68,0.08)', fg: solid ? '#fff' : 'var(--navy)' },
    new:  { bg: '#065F46', fg: '#fff' },
    featured: { bg: 'var(--gold)', fg: 'var(--navy)' },
  };
  const t = tones[tone] || tones.gold;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      fontFamily: 'DM Sans', fontSize: 10.5, fontWeight: 700, letterSpacing: '0.1em',
      textTransform: 'uppercase', padding: '4px 10px', borderRadius: 999,
      background: t.bg, color: t.fg, ...style,
    }}>{children}</span>
  );
}

// Serviços dropdown card (desktop)
function ServCard({ card, isActive, onClick }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: hov || isActive ? card.accent + '12' : 'transparent',
        border: `2px solid ${isActive ? card.accent : hov ? card.accent + '55' : 'var(--border)'}`,
        borderRadius: 12, padding: '14px 12px', cursor: 'pointer', textAlign: 'left',
        transition: 'all 0.15s ease', width: '100%',
      }}>
      <div style={{ fontSize: 22, marginBottom: 10, lineHeight: 1 }}>{card.icon}</div>
      <div style={{ fontFamily: 'DM Sans', fontWeight: 700, fontSize: 13.5, lineHeight: 1.2,
        color: isActive || hov ? card.accent : 'var(--navy)', marginBottom: 4 }}>{card.label}</div>
      <div style={{ fontFamily: 'DM Sans', fontSize: 10.5, fontWeight: 600,
        color: card.accent, marginBottom: 6, letterSpacing: '0.04em' }}>{card.tagline}</div>
      <div style={{ fontSize: 11.5, color: 'var(--fg-2)', lineHeight: 1.4 }}>{card.desc}</div>
    </button>
  );
}

// Site header — sticky w/ blur
const ROLE_PORTAL = {
  proprietario: 'portal',
  corretor:     'corretor',
  fotografo:    'fotografo',
  comprador:    'busca',
};
const ROLE_AVATAR_COLOR = {
  proprietario: 'var(--gold)',
  corretor:     '#059669',
  fotografo:    '#B87333',
  comprador:    'var(--navy)',
};
const ROLE_CTA = {
  proprietario: { label: 'Anunciar imóvel', route: 'anunciar' },
  corretor:     { label: 'Meu portal',      route: 'corretor' },
  fotografo:    { label: 'Meus jobs',       route: 'fotografo' },
  comprador:    { label: 'Anunciar imóvel', route: null },
};

function SiteHeader({ active, onNav, density = 'comfortable', authUser, onAuthOpen, onLogout }) {
  const pad = density === 'compact' ? '10px 0' : '14px 0';
  const [mobileOpen, setMobileOpen] = React.useState(false);
  const [servOpen, setServOpen] = React.useState(false);
  const [dropOpen, setDropOpen] = React.useState(false);
  const dropRef = React.useRef(null);

  const portalRoute = authUser ? (ROLE_PORTAL[authUser.role] || 'portal') : null;
  const avatarColor = authUser ? (ROLE_AVATAR_COLOR[authUser.role] || 'var(--gold)') : null;
  const cta = authUser ? (ROLE_CTA[authUser.role] || ROLE_CTA.comprador) : null;

  const handleCta = () => {
    setMobileOpen(false);
    if (!authUser) { onAuthOpen('criar'); return; }
    if (cta.route) onNav(cta.route);
  };
  const go = (id) => { setMobileOpen(false); setServOpen(false); setDropOpen(false); onNav(id); };

  React.useEffect(() => { setMobileOpen(false); setServOpen(false); setDropOpen(false); }, [active]);

  React.useEffect(() => {
    if (!dropOpen) return;
    const handler = (e) => {
      if (dropRef.current && !dropRef.current.contains(e.target)) setDropOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [dropOpen]);

  const navItems = [
    { id: 'home',        label: 'Início' },
    { id: 'busca',       label: 'Compra' },
    { id: 'vender',      label: 'Venda' },
    { id: 'lancamentos', label: 'Lançamentos' },
    { id: 'sobre',       label: 'Sobre' },
  ];

  const servCards = [
    { id: 'proprietario',    icon: '🏠', label: 'Proprietário',        tagline: 'Venda seu imóvel',           desc: 'Taxa fixa, assistida ou completa — você escolhe como anunciar.', accent: 'var(--gold)' },
    { id: 'corretor-canal',  icon: '🤝', label: 'Corretor Parceiro',   tagline: 'Leads + CRM + imóveis',      desc: 'Acesse o portfólio premium de BH com ferramentas exclusivas.',    accent: '#059669' },
    { id: 'fotografo-canal', icon: '📷', label: 'Fotógrafo',           tagline: 'Jobs + portfólio + pagamento', desc: 'Fotografe imóveis de alto padrão e receba por job via FactorOne.', accent: '#B87333' },
  ];

  const servActive = ['corretor', 'fotografo', 'anunciar', 'portal', 'proprietario', 'corretor-canal', 'fotografo-canal'].includes(active);

  const linkBase = (isActive) => ({
    fontFamily: 'DM Sans', fontSize: 13.5, fontWeight: 500, cursor: 'pointer',
    color: isActive ? 'var(--gold)' : 'var(--navy-muted)',
    borderBottom: isActive ? '2px solid var(--gold)' : '2px solid transparent',
    padding: '4px 0', textDecoration: 'none', whiteSpace: 'nowrap',
  });

  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 100,
      background: 'rgba(250,249,246,0.97)', backdropFilter: 'blur(12px)',
      borderBottom: '1px solid var(--border)',
    }}>
      <div style={{ width: 'min(1280px, 94vw)', margin: '0 auto', display: 'flex',
        alignItems: 'center', justifyContent: 'space-between', padding: pad, gap: 16 }}>

        {/* Logo */}
        <a onClick={(e) => { e.preventDefault(); go('home'); }}
           style={{ display: 'flex', alignItems: 'center', textDecoration: 'none', cursor: 'pointer', flexShrink: 0 }}>
          <BrandLockup />
        </a>

        {/* ── Desktop nav ── */}
        <nav className="vnp-nav-desktop" style={{ alignItems: 'center', gap: 22 }}>
          {navItems.map(it => (
            <a key={it.id} onClick={(e) => { e.preventDefault(); go(it.id); }}
               style={linkBase(active === it.id)}>{it.label}</a>
          ))}

          {/* SERVIÇOS dropdown — click-based, 3 visual cards */}
          <div ref={dropRef} style={{ position: 'relative' }}>
            <button onClick={() => setDropOpen(o => !o)} style={{
              ...linkBase(servActive),
              display: 'inline-flex', alignItems: 'center', gap: 4,
              background: 'none', border: 'none', cursor: 'pointer', padding: '4px 0',
            }}>
              Serviços
              <span style={{ fontSize: 9, opacity: 0.65, display: 'inline-block',
                transform: dropOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }}>▾</span>
            </button>
            {dropOpen && (
              <div style={{
                position: 'absolute', top: 'calc(100% + 12px)', left: '50%',
                transform: 'translateX(-50%)',
                background: '#fff', borderRadius: 16, padding: '10px',
                boxShadow: '0 20px 56px rgba(15,34,68,0.18), 0 0 0 1px rgba(15,34,68,0.08)',
                width: 510, zIndex: 200,
              }}>
                {/* Arrow */}
                <div style={{ position: 'absolute', top: -7, left: '50%', transform: 'translateX(-50%)',
                  width: 0, height: 0,
                  borderLeft: '7px solid transparent', borderRight: '7px solid transparent',
                  borderBottom: '7px solid #fff',
                  filter: 'drop-shadow(0 -1px 0 rgba(15,34,68,0.06))',
                }} />
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
                  {servCards.map(card => (
                    <ServCard key={card.id} card={card} isActive={active === card.id} onClick={() => go(card.id)} />
                  ))}
                </div>
              </div>
            )}
          </div>

          <span style={{ width: 1, height: 22, background: 'var(--border)' }} />

          {authUser ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <a onClick={() => go(portalRoute)} style={{
                fontFamily: 'DM Sans', fontSize: 13, fontWeight: 600,
                color: 'var(--navy)', cursor: 'pointer', textDecoration: 'none',
                display: 'flex', alignItems: 'center', gap: 7,
              }}>
                <span style={{
                  width: 30, height: 30, borderRadius: '50%',
                  background: avatarColor, color: '#fff',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontWeight: 700, fontSize: 13,
                }}>{authUser.name.charAt(0).toUpperCase()}</span>
                {authUser.name.split(' ')[0]}
              </a>
              <button onClick={onLogout} style={{
                border: 'none', background: 'none', cursor: 'pointer',
                fontFamily: 'DM Sans', fontSize: 12, color: 'var(--fg-2)',
              }}>Sair</button>
            </div>
          ) : (
            <a onClick={() => onAuthOpen('entrar')} style={{
              fontFamily: 'DM Sans', fontSize: 13, color: 'var(--navy-muted)', cursor: 'pointer',
            }}>Entrar</a>
          )}
          <Btn size="sm" variant="primary" onClick={handleCta}>
            {authUser ? cta.label : 'Cadastrar'}
          </Btn>
        </nav>

        {/* ── Hamburger (mobile only) ── */}
        <button className="vnp-hamburger" onClick={() => setMobileOpen(o => !o)}
          style={{
            width: 40, height: 40, background: 'none', border: '1px solid var(--border)',
            borderRadius: 8, cursor: 'pointer', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center', gap: 5, padding: 0,
          }}>
          {[0,1,2].map(i => (
            <span key={i} style={{
              display: 'block', width: 20, height: 2,
              background: 'var(--navy)', borderRadius: 2, transition: 'all 0.2s',
              transform: mobileOpen
                ? i === 0 ? 'rotate(45deg) translate(5px,5px)'
                : i === 2 ? 'rotate(-45deg) translate(5px,-5px)'
                : 'scaleX(0)'
                : 'none',
            }} />
          ))}
        </button>
      </div>

      {/* ── Mobile drawer ── */}
      <div className={`vnp-drawer${mobileOpen ? ' open' : ''}`}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginBottom: 24 }}>
          {navItems.map(it => (
            <a key={it.id} onClick={() => go(it.id)} style={{
              padding: '13px 16px', borderRadius: 10,
              fontFamily: 'DM Sans', fontSize: 16, fontWeight: active === it.id ? 700 : 500,
              color: active === it.id ? 'var(--gold)' : 'var(--navy)',
              background: active === it.id ? 'rgba(201,150,14,0.08)' : 'transparent',
              cursor: 'pointer', textDecoration: 'none', display: 'block',
            }}>{it.label}</a>
          ))}

          {/* Serviços expandable */}
          <div>
            <button onClick={() => setServOpen(o => !o)} style={{
              width: '100%', padding: '13px 16px', borderRadius: 10,
              fontFamily: 'DM Sans', fontSize: 16, fontWeight: servActive ? 700 : 500,
              color: servActive ? 'var(--gold)' : 'var(--navy)',
              background: servActive ? 'rgba(201,150,14,0.08)' : 'transparent',
              border: 'none', cursor: 'pointer', textAlign: 'left',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            }}>
              Serviços
              <span style={{ fontSize: 12, opacity: 0.55 }}>{servOpen ? '▴' : '▾'}</span>
            </button>
            {servOpen && (
              <div style={{ paddingLeft: 16, paddingTop: 4, display: 'flex', flexDirection: 'column', gap: 2 }}>
                {servCards.map(s => (
                  <a key={s.id} onClick={() => go(s.id)} style={{
                    padding: '10px 16px', borderRadius: 8,
                    fontFamily: 'DM Sans', fontSize: 14, fontWeight: active === s.id ? 700 : 400,
                    color: active === s.id ? s.accent : 'var(--navy)',
                    background: active === s.id ? 'rgba(201,150,14,0.08)' : 'transparent',
                    cursor: 'pointer', textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 8,
                  }}>
                    <span>{s.icon}</span>{s.label}
                  </a>
                ))}
              </div>
            )}
          </div>
        </div>

        <div style={{ height: 1, background: 'var(--border)', marginBottom: 20 }} />

        {authUser ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '0 4px', marginBottom: 4 }}>
              <span style={{
                width: 40, height: 40, borderRadius: '50%',
                background: avatarColor, color: '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontWeight: 800, fontSize: 16, flexShrink: 0,
              }}>{authUser.name.charAt(0).toUpperCase()}</span>
              <div>
                <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--navy)' }}>{authUser.name}</div>
                <div style={{ fontSize: 12, color: 'var(--fg-2)', textTransform: 'capitalize' }}>{authUser.role}</div>
              </div>
            </div>
            <button onClick={() => go(portalRoute)} style={{
              padding: '13px', background: 'var(--navy)', color: '#fff',
              border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 15, cursor: 'pointer',
            }}>Meu portal</button>
            <button onClick={() => { setMobileOpen(false); onLogout(); }} style={{
              padding: '11px', background: 'transparent', color: 'var(--fg-2)',
              border: '1px solid var(--border)', borderRadius: 10, fontWeight: 500, fontSize: 14, cursor: 'pointer',
            }}>Sair</button>
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <button onClick={() => { setMobileOpen(false); onAuthOpen('entrar'); }} style={{
              padding: '13px', background: 'transparent', color: 'var(--navy)',
              border: '1.5px solid var(--border)', borderRadius: 10, fontWeight: 600, fontSize: 15, cursor: 'pointer',
            }}>Entrar</button>
            <button onClick={handleCta} style={{
              padding: '13px',
              background: 'linear-gradient(135deg, var(--gold) 0%, #e6a800 100%)',
              color: '#fff', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 15, cursor: 'pointer',
            }}>Cadastrar</button>
          </div>
        )}
      </div>
    </header>
  );
}

// Auth modal — login + criar conta (com seleção de perfil)
const ROLES = [
  {
    id: 'proprietario',
    label: 'Proprietário',
    desc: 'Quero anunciar meu imóvel',
    icon: '🏠',
    accent: 'var(--gold)',
  },
  {
    id: 'corretor',
    label: 'Corretor',
    desc: 'Sou parceiro VN Prime',
    icon: '🤝',
    accent: '#059669',
  },
  {
    id: 'fotografo',

function AuthModal({ isOpen, defaultTab = 'entrar', onClose, onAuth }) {
  const [tab, setTab] = useState(defaultTab);
  const [step, setStep] = useState(1); // 1: dados, 2: perfil
  const [form, setForm] = useState({ name: '', email: '', phone: '', password: '' });
  const [role, setRole] = useState('');
  const [error, setError] = useState('');

  useEffect(() => {
    setTab(defaultTab);
    setStep(1);
    setError('');
    setRole('');
  }, [defaultTab, isOpen]);

  if (!isOpen) return null;

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const handleStep1 = (e) => {
    e.preventDefault();
    setError('');
    if (!form.name.trim() || !form.email.trim() || !form.phone.trim() || !form.password.trim()) {
      setError('Preencha todos os campos obrigatórios.'); return;
    }
    setStep(2);
  };

  const handleFinish = () => {
    if (!role) { setError('Selecione seu perfil para continuar.'); return; }
    const user = {
      name: form.name.trim(),
      email: form.email.trim(),
      phone: form.phone.trim(),
      role,
    };
    localStorage.setItem('vnprime_user', JSON.stringify(user));
    onAuth(user);
  };

  const handleLogin = (e) => {
    e.preventDefault();
    setError('');
    const stored = localStorage.getItem('vnprime_user');
    if (stored) {
      const user = JSON.parse(stored);
      if (user.email === form.email.trim()) { onAuth(user); return; }
    }
    setError('E-mail não encontrado. Crie uma conta para continuar.');
  };

  const fl = { display: 'flex', flexDirection: 'column', gap: 6 };
  const lb = {
    fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700,
    letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--fg-2)',
  };

  return (
    <div onClick={(e) => { if (e.target === e.currentTarget) onClose(); }} style={{
      position: 'fixed', inset: 0, zIndex: 500,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 20, background: 'rgba(15,34,68,0.58)', backdropFilter: 'blur(5px)',
    }}>
      <div style={{
        background: '#fff', borderRadius: 20, padding: '2rem',
        width: '100%', maxWidth: 460,
        boxShadow: '0 28px 64px rgba(15,34,68,0.24)', position: 'relative',
      }}>
        <button onClick={onClose} style={{
          position: 'absolute', top: 16, right: 16, border: 'none',
          background: 'none', cursor: 'pointer', fontSize: 20, color: 'var(--fg-2)', lineHeight: 1,
        }}>✕</button>

        <div style={{ textAlign: 'center', marginBottom: 24 }}><BrandLockup /></div>

        {/* Tabs — só visíveis no step 1 */}
        {step === 1 && (
          <div style={{ display: 'flex', borderBottom: '1px solid var(--border)', marginBottom: 24 }}>
            {[['entrar', 'Entrar'], ['criar', 'Criar conta']].map(([id, label]) => (
              <button key={id} onClick={() => { setTab(id); setError(''); }} style={{
                flex: 1, padding: '0.65rem', border: 'none', background: 'none', cursor: 'pointer',
                fontFamily: 'DM Sans', fontSize: 14, fontWeight: 600,
                color: tab === id ? 'var(--gold)' : 'var(--fg-2)',
                borderBottom: tab === id ? '2px solid var(--gold)' : '2px solid transparent',
                marginBottom: -1,
              }}>{label}</button>
            ))}
          </div>
        )}

        {/* STEP 2 — Seleção de perfil */}
        {tab === 'criar' && step === 2 ? (
          <div>
            <p style={{ fontFamily: 'DM Sans', fontWeight: 600, fontSize: 15, color: 'var(--navy)', margin: '0 0 6px', textAlign: 'center' }}>
              Olá, {form.name.split(' ')[0]}! Quem é você?
            </p>
            <p style={{ fontSize: 13, color: 'var(--fg-2)', textAlign: 'center', margin: '0 0 20px' }}>
              Vamos personalizar sua experiência na plataforma.
            </p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
              {ROLES.map(r => (
                <button key={r.id} type="button" onClick={() => { setRole(r.id); setError(''); }} style={{
                  border: `2px solid ${role === r.id ? r.accent : 'var(--border)'}`,
                  borderRadius: 14, padding: '18px 14px', cursor: 'pointer', background: '#fff',
                  textAlign: 'center', transition: 'border-color 0.15s, box-shadow 0.15s',
                  boxShadow: role === r.id ? `0 0 0 3px ${r.accent}22` : 'none',
                }}>
                  <div style={{ fontSize: 28, marginBottom: 8 }}>{r.icon}</div>
                  <div style={{ fontFamily: 'DM Sans', fontWeight: 700, fontSize: 14, color: 'var(--navy)', marginBottom: 4 }}>
                    {r.label}
                  </div>
                  <div style={{ fontSize: 11.5, color: 'var(--fg-2)', lineHeight: 1.4 }}>{r.desc}</div>
                </button>
              ))}
            </div>
            {error && <p style={{ color: '#dc2626', fontSize: 13, margin: '0 0 12px' }}>{error}</p>}
            <Btn variant="accent" fullWidth onClick={handleFinish}>
              Criar minha conta →
            </Btn>
            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <button type="button" onClick={() => { setStep(1); setError(''); }} style={{
                border: 'none', background: 'none', cursor: 'pointer',
                fontSize: 13, color: 'var(--fg-2)', textDecoration: 'underline',
              }}>← Voltar</button>
            </div>
          </div>
        ) : (
          /* STEP 1 — Formulário */
          <form onSubmit={tab === 'criar' ? handleStep1 : handleLogin}
            style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            {tab === 'criar' && (
              <div style={fl}>
                <label style={lb}>Nome completo *</label>
                <input type="text" value={form.name} onChange={set('name')} placeholder="Seu nome completo" required />
              </div>
            )}
            <div style={fl}>
              <label style={lb}>E-mail *</label>
              <input type="email" value={form.email} onChange={set('email')} placeholder="seu@email.com" required />
            </div>
            {tab === 'criar' && (
              <div style={fl}>
                <label style={lb}>WhatsApp *</label>
                <input type="tel" value={form.phone} onChange={set('phone')} placeholder="(31) 99999-9999" required />
              </div>
            )}
            <div style={fl}>
              <label style={lb}>Senha *</label>
              <input type="password" value={form.password} onChange={set('password')} placeholder="••••••••" required />
            </div>

            {error && <p style={{ color: '#dc2626', fontSize: 13, margin: 0 }}>{error}</p>}

            {tab === 'criar' && (
              <p style={{ fontSize: 12, color: 'var(--fg-2)', margin: 0, lineHeight: 1.6 }}>
                Ao criar sua conta você concorda com os{' '}
                <a href="#" style={{ color: 'var(--gold)' }}>termos de uso</a> e{' '}
                <a href="#" style={{ color: 'var(--gold)' }}>política de privacidade</a>.
              </p>
            )}

            <Btn type="submit" variant="accent" fullWidth style={{ marginTop: 4 }}>
              {tab === 'entrar' ? 'Entrar na plataforma' : 'Continuar →'}
            </Btn>

            <div style={{ textAlign: 'center' }}>
              <button type="button" onClick={() => { setTab(tab === 'entrar' ? 'criar' : 'entrar'); setError(''); }}
                style={{ border: 'none', background: 'none', cursor: 'pointer', fontSize: 13, color: 'var(--navy)', textDecoration: 'underline' }}>
                {tab === 'entrar' ? 'Ainda não tem conta? Criar agora' : 'Já tenho uma conta'}
              </button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

// Property feature row (icons + numbers) — used on cards & detail
function FeatureRow({ areaM2, quartos, suites, vagas, banheiros, compact = false }) {
  const items = [
    { icon: '⌗', val: areaM2, lbl: 'm²' },
    { icon: '⌂', val: quartos, lbl: quartos === 1 ? 'qto' : 'qtos' },
    { icon: '✦', val: suites, lbl: suites === 1 ? 'suíte' : 'suítes' },
    { icon: '⛌', val: vagas, lbl: vagas === 1 ? 'vaga' : 'vagas' },
  ];
  if (banheiros !== undefined) items.splice(3, 0, { icon: '☂', val: banheiros, lbl: banheiros === 1 ? 'banh.' : 'banhs.' });
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: compact ? 12 : 18,
      fontFamily: 'DM Sans', fontSize: compact ? 12 : 13, color: 'var(--fg-2)' }}>
      {items.map((it, i) => (
        <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
          <span style={{ color: 'var(--gold)', fontSize: compact ? 13 : 15, lineHeight: 1 }}>{it.icon}</span>
          <b style={{ color: 'var(--navy)', fontWeight: 600 }}>{it.val}</b>
          <span>{it.lbl}</span>
        </span>
      ))}
    </div>
  );
}

// VN Prime — Listing card (ImovelWeb-style with VN Prime aesthetic)
function ListingCard({ listing, onOpen, layout = 'grid' }) {
  const [photoIdx, setPhotoIdx] = useState(0);
  const [favorited, setFav] = useState(false);
  const { codigo, title, neighborhood, city, type, operation,
    price, condo, areaM2, quartos, suites, vagas, banheiros,

  return (
    <article
      onClick={() => onOpen && onOpen(listing)}

        background: 'var(--surface)', borderRadius: 14, border: '1px solid var(--border)',

    >
      {/* Photo carousel */}
      <div style={{
        position: 'relative',

        background: `url(${photos[photoIdx]}) center/cover`,
        transition: 'background-image 0.3s ease',
      }}>
        {/* Top-left badges */}
        <div style={{ position: 'absolute', top: 12, left: 12, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {isFeatured && <Pill tone="featured">★ Destaque</Pill>}
          {isNew && <Pill tone="new">Novo</Pill>}
        </div>
        {/* Top-right favorite */}
        <button
          onClick={(e) => { e.stopPropagation(); setFav(!favorited); }}
          style={{
            position: 'absolute', top: 12, right: 12,
            width: 34, height: 34, borderRadius: 999, border: 'none', cursor: 'pointer',
            background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(6px)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: favorited ? 'var(--gold)' : 'var(--navy)',
            fontSize: 16,
          }}>{favorited ? '♥' : '♡'}</button>
        {/* Photo nav */}
        {photos.length > 1 && (
          <React.Fragment>
            <button
              onClick={(e) => { e.stopPropagation(); setPhotoIdx((photoIdx - 1 + photos.length) % photos.length); }}
              style={photoNavStyle('left')}>‹</button>
            <button
              onClick={(e) => { e.stopPropagation(); setPhotoIdx((photoIdx + 1) % photos.length); }}
              style={photoNavStyle('right')}>›</button>
            <div style={{ position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)',
              display: 'flex', gap: 4 }}>
              {photos.map((_, i) => (
                <span key={i} style={{
                  width: i === photoIdx ? 18 : 6, height: 4, borderRadius: 2,
                  background: i === photoIdx ? 'var(--gold)' : 'rgba(255,255,255,0.6)',
                  transition: 'width 0.2s ease',
                }} />
              ))}
            </div>
          </React.Fragment>
        )}
        {/* bottom feature pills */}
        {listing.features && listing.features.length > 0 && (
          <div style={{ position: 'absolute', bottom: 10, left: 12, right: 56,

              <span key={f} style={{ fontFamily: 'DM Sans', fontSize: 9.5, fontWeight: 700,

                backdropFilter: 'blur(4px)', whiteSpace: 'nowrap' }}>{f}</span>
            ))}
          </div>
        )}
      </div>

      {/* Body */}
      <div style={{ padding: '18px 22px 22px', display: 'flex', flexDirection: 'column', gap: 8 }}>

        {condo > 0 && (

            Ver imóvel →

        </div>
      </div>
    </article>
  );
}

    color: 'var(--navy)', fontSize: 18, fontWeight: 700, lineHeight: 1,
  };
}

<script type="text/babel">
// Search results page — ImovelWeb-style with sidebar filters + map toggle

function SearchResultsPage({ onNav, initial = {}, density = 'comfortable' }) {
  const [filters, setFilters] = useState({
    op: initial.op || 'compra',
    q: initial.q || '',
    tipo: initial.tipo || '',
    bairros: [],
    quartos: 0,
    priceMin: '', priceMax: '',
    areaMin: '',
    onlyFeatured: false,
    onlyNew: false,
  });
  const [sort, setSort] = useState('relevance');
  const [layout, setLayout] = useState('grid'); // grid | list | map
  const [page, setPage] = useState(1);
  const PER_PAGE = 9;

  const results = useMemo(() => {
    let r = window.VN_CATALOG.filter(l => {
      if (filters.op && l.operation !== filters.op) return false;
      if (filters.q) {
        const q = filters.q.toLowerCase();
        if (!l.title.toLowerCase().includes(q)
          && !l.neighborhood.toLowerCase().includes(q)
          && !l.city.toLowerCase().includes(q)
          && !l.codigo.toLowerCase().includes(q)) return false;
      }
      if (filters.tipo && l.type !== filters.tipo) return false;
      if (filters.bairros.length && !filters.bairros.includes(l.neighborhood)) return false;
      if (filters.quartos && l.quartos < filters.quartos) return false;
      if (filters.priceMin && l.price < +filters.priceMin) return false;
      if (filters.priceMax && l.price > +filters.priceMax) return false;
      if (filters.areaMin && l.areaM2 < +filters.areaMin) return false;
      if (filters.onlyFeatured && !l.isFeatured) return false;
      if (filters.onlyNew && !l.isNew) return false;
      return true;
    });
    if (sort === 'price_asc') r.sort((a, b) => a.price - b.price);
    if (sort === 'price_desc') r.sort((a, b) => b.price - a.price);
    if (sort === 'area_desc') r.sort((a, b) => b.areaM2 - a.areaM2);
    if (sort === 'newest') r.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
    return r;
  }, [filters, sort]);

  const visible = results.slice(0, page * PER_PAGE);
  const allBairros = [...new Set(window.VN_CATALOG.map(l => l.neighborhood))];

  return (

          <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
            <select value={sort} onChange={(e) => setSort(e.target.value)}

              <option value="price_asc">Menor preço</option>
              <option value="price_desc">Maior preço</option>
              <option value="area_desc">Maior área</option>
              <option value="newest">Recém adicionados</option>

                    background: layout === id ? 'var(--navy)' : 'transparent',
                    color: layout === id ? 'var(--gold)' : 'var(--navy)',
                    fontSize: 14, fontFamily: 'DM Sans', fontWeight: 600,
                  }}>{icon}</button>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* Body */}
      <section style={{ padding: '24px 0 60px' }}>

            maxHeight: 'calc(100vh - 150px)', overflowY: 'auto' }}>
            <div style={{ fontFamily: 'Playfair Display', fontSize: 17, fontWeight: 600,
              color: 'var(--navy)', marginBottom: 4 }}>Refinar busca</div>
            <button onClick={() => setFilters({ op: filters.op, q: '', tipo: '', bairros: [],
              quartos: 0, priceMin: '', priceMax: '', areaMin: '', onlyFeatured: false, onlyNew: false })}
              style={{ background: 'none', border: 'none', color: 'var(--gold)', cursor: 'pointer',
                fontFamily: 'DM Sans', fontSize: 11.5, fontWeight: 600, padding: 0,
                marginBottom: 18, textDecoration: 'underline' }}>Limpar filtros</button>

            <FilterGroup title="Localização">

                value={filters.q} onChange={(e) => setFilters({ ...filters, q: e.target.value })}

            </FilterGroup>

            <FilterGroup title="Tipo de imóvel">
              <select value={filters.tipo} onChange={(e) => setFilters({ ...filters, tipo: e.target.value })}

                <option>Apartamento</option><option>Casa</option><option>Cobertura</option>
              </select>
            </FilterGroup>

            <FilterGroup title="Quartos">
              <div style={{ display: 'flex', gap: 4 }}>
                {[0, 1, 2, 3, 4].map(n => (
                  <button key={n} onClick={() => setFilters({ ...filters, quartos: n })}

                      flex: 1, padding: '0.5rem 0', border: '1px solid',
                      borderColor: filters.quartos === n ? 'var(--gold)' : 'var(--border)',
                      background: filters.quartos === n ? 'rgba(201,150,14,0.1)' : '#fff',
                      color: 'var(--navy)', cursor: 'pointer', borderRadius: 6,
                      fontFamily: 'DM Sans', fontSize: 12, fontWeight: 600,
                    }}>{n === 0 ? 'Todos' : `${n}+`}</button>

              </div>
            </FilterGroup>

            <FilterGroup title="Faixa de preço">
              <div style={{ display: 'flex', gap: 6 }}>
                <input type="number" placeholder="Mín" value={filters.priceMin}
                  onChange={(e) => setFilters({ ...filters, priceMin: e.target.value })}

                <input type="number" placeholder="Máx" value={filters.priceMax}
                  onChange={(e) => setFilters({ ...filters, priceMax: e.target.value })}
                  style={{ ...inputStyle, fontSize: 12.5 }} />

            </FilterGroup>

            <FilterGroup title="Área mínima (m²)">
              <input type="number" placeholder="Ex.: 100" value={filters.areaMin}

                style={{ ...inputStyle, fontSize: 13 }} />

            <FilterGroup title="Bairros populares">
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>

                    <input type="checkbox" checked={filters.bairros.includes(b)}

              </div>
            </FilterGroup>

            <FilterGroup title="Outros">
              <label style={{ display: 'flex', alignItems: 'center', gap: 8,
                fontFamily: 'DM Sans', fontSize: 13, color: 'var(--navy)', cursor: 'pointer', marginBottom: 6 }}>
                <input type="checkbox" checked={filters.onlyFeatured}
                  onChange={(e) => setFilters({ ...filters, onlyFeatured: e.target.checked })}

              </label>
              <label style={{ display: 'flex', alignItems: 'center', gap: 8,
                fontFamily: 'DM Sans', fontSize: 13, color: 'var(--navy)', cursor: 'pointer' }}>
                <input type="checkbox" checked={filters.onlyNew}
                  onChange={(e) => setFilters({ ...filters, onlyNew: e.target.checked })}
                  style={{ accentColor: 'var(--gold)' }} />

              </label>
            </FilterGroup>
          </aside>

          {/* Results */}
          <div>
            {layout === 'map' ? (
              <MapResults listings={results} onOpen={(l) => onNav('detalhe', { id: l.id })} />

                <div style={{

                    : 'repeat(auto-fit, minmax(280px, 1fr))',
                }}>
                  {visible.map(l => (
                    <ListingCard key={l.id} listing={l}
                      onOpen={(x) => onNav('detalhe', { id: x.id })}
                      layout={layout === 'list' ? 'horizontal' : 'grid'} />
                  ))}
                </div>
                {visible.length < results.length && (
                  <div style={{ textAlign: 'center', marginTop: 30 }}>
                    <Btn variant="ghost" onClick={() => setPage(page + 1)}>

                  </div>
                )}

            )}
          </div>
        </div>
      </section>
    </main>
  );
}

function FilterGroup({ title, children }) {
  return (
    <div style={{ marginBottom: 18, paddingBottom: 18, borderBottom: '1px solid var(--border)' }}>
      <div style={{ fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700,
        letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--fg-2)',
        marginBottom: 10 }}>{title}</div>
      {children}
    </div>
  );
}

function OperationTabsLight({ value, onChange }) {
  const tabs = [
    { id: 'compra', label: 'Comprar' },
    { id: 'lancamento', label: 'Lançamentos' },
  ];
  return (
    <div style={{ display: 'inline-flex', gap: 4 }}>
      {tabs.map(t => {
        const active = value === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            style={{
              fontFamily: 'DM Sans', fontSize: 13, fontWeight: 600,
              padding: '0.55rem 1.1rem', borderRadius: 7, cursor: 'pointer',
              border: '1px solid', borderColor: active ? 'var(--navy)' : 'var(--border)',
              background: active ? 'var(--navy)' : '#fff',
              color: active ? 'var(--gold)' : 'var(--navy-muted)',
            }}>{t.label}</button>
        );
      })}
    </div>
  );
}

function EmptyState({ onClear }) {
  return (
    <div style={{ background: '#fff', borderRadius: 14, padding: '60px 30px',
      textAlign: 'center', border: '1px solid var(--border)' }}>
      <div style={{ fontSize: 40, color: 'var(--gold)' }}>◇</div>
      <h3 style={{ marginTop: 16 }}>Nenhum imóvel encontrado</h3>
      <p style={{ color: 'var(--fg-2)', maxWidth: 360, margin: '0 auto 18px' }}>
        Tente ajustar seus filtros ou ampliar a busca para outros bairros.
      </p>
      <Btn variant="accent" onClick={onClear}>Limpar filtros</Btn>
    </div>
  );
}

// Map view — stylized abstract map (no real tiles)
function MapResults({ listings, onOpen }) {
  const [hovered, setHovered] = useState(null);
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18,
      height: 'calc(100vh - 200px)', minHeight: 600,
    }}>
      {/* Faux map */}
      <div style={{
        position: 'relative', borderRadius: 14, overflow: 'hidden',
        background: 'linear-gradient(135deg, #E8EEF6 0%, #D6DEE8 100%)',
        border: '1px solid var(--border)',
      }}>
        {/* abstract grid lines */}
        <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, opacity: 0.5 }}>
          <defs>
            <pattern id="map-grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(15,34,68,0.08)" strokeWidth="1"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#map-grid)" />
          {/* fake roads */}
          <path d="M0 240 Q300 200 600 280 T1200 250" stroke="rgba(255,255,255,0.7)" strokeWidth="6" fill="none"/>
          <path d="M180 0 Q200 200 280 400 T380 800" stroke="rgba(255,255,255,0.6)" strokeWidth="5" fill="none"/>
          <path d="M0 460 L600 480" stroke="rgba(255,255,255,0.5)" strokeWidth="4" fill="none"/>
        </svg>
        {/* pins */}
        {listings.slice(0, 12).map((l, i) => {
          const x = 12 + ((i * 137) % 78);
          const y = 14 + ((i * 59) % 72);
          const active = hovered === l.id;
          return (
            <button key={l.id}
              onMouseEnter={() => setHovered(l.id)}
              onMouseLeave={() => setHovered(null)}
              onClick={() => onOpen(l)}
              style={{
                position: 'absolute', left: `${x}%`, top: `${y}%`,
                transform: 'translate(-50%, -100%)',
                background: active ? 'var(--navy)' : 'var(--gold)',
                color: active ? 'var(--gold)' : 'var(--navy)',
                border: '2px solid #fff', borderRadius: 999, padding: '5px 11px',
                fontFamily: 'DM Sans', fontSize: 12, fontWeight: 700,
                cursor: 'pointer', whiteSpace: 'nowrap',
                boxShadow: '0 4px 14px rgba(15,34,68,0.25)',
                transition: 'all 0.18s ease', zIndex: active ? 10 : 1,
              }}>{fmtBRLshort(l.price)}</button>
          );
        })}
        <div style={{ position: 'absolute', bottom: 14, left: 14,
          background: 'rgba(255,255,255,0.95)', padding: '6px 12px', borderRadius: 6,
          fontFamily: 'DM Sans', fontSize: 11, color: 'var(--fg-2)',
          backdropFilter: 'blur(6px)' }}>
          BH · Nova Lima · Região metropolitana
        </div>
      </div>
      {/* List on side */}
      <div style={{ overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 14, paddingRight: 4 }}>
        {listings.slice(0, 12).map(l => (
          <div key={l.id}
            onMouseEnter={() => setHovered(l.id)}
            onMouseLeave={() => setHovered(null)}>
            <ListingCard listing={l} onOpen={onOpen} layout="horizontal" />
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { SearchResultsPage });

// ── Seletor de áreas ──────────────────────────────────────────────────────────
function AreasTab({ selected, onChange }) {
  const totalAreas = AREAS_GBH.reduce((s, g) => s + g.areas.length, 0);
  const gruposSelecionados = [...new Set(selected.map(a => AREA_TO_GRUPO[a]).filter(Boolean))];

  const toggleArea = (area) => {
    onChange(selected.includes(area) ? selected.filter(x => x !== area) : [...selected, area]);
  };

  const toggleGrupo = (grupo) => {
    const areasDoGrupo = AREAS_GBH.find(g => g.grupo === grupo)?.areas || [];
    const todasSelecionadas = areasDoGrupo.every(a => selected.includes(a));
    if (todasSelecionadas) {
      onChange(selected.filter(a => !areasDoGrupo.includes(a)));
    } else {
      const novas = areasDoGrupo.filter(a => !selected.includes(a));
      onChange([...selected, ...novas]);
    }
  };

  const selectAll = () => onChange(AREAS_GBH.flatMap(g => g.areas));
  const clearAll  = () => onChange([]);

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:12 }}>
        <div>
          <h2 style={{ margin:0, fontSize:17, color:'var(--navy)' }}>Áreas de atuação</h2>
          <p style={{ margin:'4px 0 0', fontSize:13, color:'var(--fg-2)' }}>
            Selecione onde você atua — leads e imóveis serão filtrados automaticamente
          </p>
        </div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <span style={{ fontSize:13, color:'var(--fg-2)' }}>
            <strong style={{ color:'var(--navy)' }}>{selected.length}</strong> / {totalAreas} áreas
          </span>
          <button onClick={selectAll} style={{ padding:'6px 12px', background:'var(--navy)', color:'#fff', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>
            Selecionar tudo
          </button>
          <button onClick={clearAll} style={{ padding:'6px 12px', background:'transparent', color:'var(--fg-2)', border:'1px solid var(--border)', borderRadius:6, fontSize:12, cursor:'pointer' }}>
            Limpar
          </button>
        </div>
      </div>

      {/* Grupos selecionados — chips resumo */}
      {gruposSelecionados.length > 0 && (
        <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
          {gruposSelecionados.map(g => {
            const grupo = AREAS_GBH.find(x => x.grupo === g);
            const count = (grupo?.areas || []).filter(a => selected.includes(a)).length;
            return (
              <span key={g} style={{ padding:'3px 10px', borderRadius:99, fontSize:12, fontWeight:600, background:`${grupo.cor}18`, color:grupo.cor, border:`1px solid ${grupo.cor}40` }}>
                {g} · {count}
              </span>
            );
          })}
        </div>
      )}

      {/* Grupos */}
      <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
        {AREAS_GBH.map(grupo => {
          const selecionadasNoGrupo = grupo.areas.filter(a => selected.includes(a));
          const todasSel = selecionadasNoGrupo.length === grupo.areas.length;
          const algumaSel = selecionadasNoGrupo.length > 0;

          return (
            <div key={grupo.grupo} style={{ background:'#fff', border:'1px solid var(--border)', borderRadius:12, overflow:'hidden' }}>
              {/* Grupo header */}
              <div
                onClick={() => toggleGrupo(grupo.grupo)}
                style={{
                  padding:'12px 16px', display:'flex', alignItems:'center', gap:12, cursor:'pointer',
                  background: todasSel ? `${grupo.cor}10` : algumaSel ? `${grupo.cor}06` : '#fff',
                  borderBottom:'1px solid var(--border)',
                }}
              >
                {/* Checkbox grupo */}
                <div style={{
                  width:20, height:20, borderRadius:5, flexShrink:0,
                  border: todasSel ? `2px solid ${grupo.cor}` : algumaSel ? `2px solid ${grupo.cor}` : '2px solid var(--border)',
                  background: todasSel ? grupo.cor : algumaSel ? `${grupo.cor}30` : '#fff',
                  display:'flex', alignItems:'center', justifyContent:'center',
                }}>
                  {todasSel && <span style={{ color:'#fff', fontSize:12, fontWeight:900 }}>✓</span>}
                  {algumaSel && !todasSel && <span style={{ color:grupo.cor, fontSize:14, fontWeight:900, lineHeight:1 }}>–</span>}
                </div>
                <div style={{ flex:1 }}>
                  <span style={{ fontWeight:700, fontSize:14, color:'var(--navy)' }}>{grupo.grupo}</span>
                  <span style={{ marginLeft:8, fontSize:12, color:'var(--fg-2)' }}>{grupo.areas.length} áreas</span>
                </div>
                {algumaSel && (
                  <span style={{ padding:'2px 8px', borderRadius:99, fontSize:11, fontWeight:700, background:grupo.cor, color:'#fff' }}>
                    {selecionadasNoGrupo.length} sel.
                  </span>
                )}
              </div>

              {/* Chips de área */}
              <div style={{ padding:'12px 16px', display:'flex', flexWrap:'wrap', gap:8 }}>
                {grupo.areas.map(area => {
                  const sel = selected.includes(area);
                  return (
                    <button
                      key={area}
                      onClick={() => toggleArea(area)}
                      style={{
                        padding:'5px 12px', borderRadius:99, fontSize:12, fontWeight:sel ? 700 : 500,
                        cursor:'pointer', transition:'all 0.12s',
                        background: sel ? grupo.cor : 'transparent',
                        color: sel ? '#fff' : 'var(--navy)',
                        border: sel ? `1.5px solid ${grupo.cor}` : '1.5px solid var(--border)',
                      }}
                    >{area}</button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* Save feedback */}
      <div style={{ padding:'12px 16px', background:'#F0FDF4', border:'1px solid #BBF7D0', borderRadius:10, fontSize:13, color:'#15803D', display:'flex', alignItems:'center', gap:8 }}>
        <span>✓</span>
        <span>Suas áreas são salvas automaticamente e aplicadas aos leads e imóveis.</span>
      </div>
    </div>
  );
}

function FormInteresse({ lancNome, compact = false }) {
  const [form, setForm] = React.useState({ nome: '', tel: '', email: '' });
  const [sent, setSent] = React.useState(false);
  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
  const submit = (e) => {
    e.preventDefault();
    if (!form.nome || !form.tel) return;
    setSent(true);
  };
  if (sent) return (
    <div style={{ textAlign: 'center', padding: '24px 0' }}>
      <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
      <div style={{ fontFamily: 'DM Sans', fontWeight: 700, fontSize: 16, color: compact ? '#fff' : 'var(--navy)' }}>
        Recebemos seu interesse!
      </div>
      <div style={{ fontSize: 13, color: compact ? 'rgba(255,255,255,0.7)' : 'var(--fg-2)', marginTop: 6 }}>
        Um consultor VN Prime entrará em contato em breve.
      </div>
    </div>
  );
  const inputSt = {
    width: '100%', fontFamily: 'DM Sans', fontSize: 14, padding: '0.75rem 1rem',
    borderRadius: 10, border: compact ? '1.5px solid rgba(255,255,255,0.25)' : '1.5px solid var(--border)',
    background: compact ? 'rgba(255,255,255,0.08)' : '#fff',
    color: compact ? '#fff' : 'var(--navy)', outline: 'none', boxSizing: 'border-box',
  };
  return (
    <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      <input type="text" placeholder="Seu nome" value={form.nome} onChange={set('nome')} style={inputSt} required />
      <input type="tel" placeholder="WhatsApp (31) 9xxxx-xxxx" value={form.tel} onChange={set('tel')} style={inputSt} required />
      <input type="email" placeholder="E-mail (opcional)" value={form.email} onChange={set('email')} style={inputSt} />
      <button type="submit" style={{
        padding: '13px', background: 'var(--gold)', color: 'var(--navy)',
        border: 'none', borderRadius: 10, fontFamily: 'DM Sans', fontWeight: 800,
        fontSize: 14, cursor: 'pointer', letterSpacing: '0.04em',
      }}>
        {lancNome ? `Quero saber mais sobre ${lancNome}` : 'Receber informações exclusivas →'}
      </button>
      <p style={{ fontSize: 11, color: compact ? 'rgba(255,255,255,0.5)' : 'var(--fg-2)', margin: 0, textAlign: 'center' }}>
        Sem spam. Suas informações são sigilosas.

    </form>
  );

// ─── Calculadoras ────────────────────────────────────────────────────────────
function Calculadoras() {
  const [tab, setTab] = React.useState('fin');
  // financiamento state
  const [vF, setVF] = React.useState(1200000);
  const [entF, setEntF] = React.useState(20);
  const [prazoF, setPrazoF] = React.useState(360);
  const [taxaF, setTaxaF] = React.useState(10.5);
  // investimento state
  const [vI, setVI] = React.useState(1200000);
  const [valI, setValI] = React.useState(12);
  const [anosI, setAnosI] = React.useState(4);
  const [alugI, setAlugI] = React.useState(0.5);

  // financiamento calc
  const principal = vF * (1 - entF / 100);
  const tmens = taxaF / 100 / 12;
  const parcela = principal * (tmens * Math.pow(1 + tmens, prazoF)) / (Math.pow(1 + tmens, prazoF) - 1);
  const totalPago = parcela * prazoF + vF * (entF / 100);

  // investimento calc
  const vFinal = vI * Math.pow(1 + valI / 100, anosI);
  const ganho = vFinal - vI;
  const alugueis = vI * (alugI / 100) * 12 * anosI;

  return (
    <section style={{ padding: 'clamp(3rem, 6vw, 5rem) 0', background: 'var(--cream)' }}>
      <div style={{ width: 'min(1280px, 94vw)', margin: '0 auto' }}>
        <div style={{ textAlign: 'center', maxWidth: 600, margin: '0 auto 40px' }}>
          <Eyebrow color="var(--gold)">Ferramentas · Planejamento</Eyebrow>
          <h2 style={{ margin: '8px 0 12px' }}>Calcule e planeje sua compra</h2>
          <p style={{ color: 'var(--fg-2)', fontSize: 15, lineHeight: 1.7, margin: 0 }}>
            Simule o financiamento ou projete a valorização do seu investimento ao longo do tempo.
          </p>
        </div>

        <div style={{ display: 'flex', gap: 4, background: '#e8e4da', borderRadius: 14,
          padding: 4, width: 'fit-content', margin: '0 auto 32px' }}>
          {[['fin', '🏦 Simulador de Financiamento'], ['inv', '📈 Retorno do Investimento']].map(([id, lbl]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              padding: '11px 22px', borderRadius: 10, border: 'none', cursor: 'pointer',
              fontFamily: 'DM Sans', fontSize: 13.5, fontWeight: 600,
              background: tab === id ? '#fff' : 'transparent',
              color: tab === id ? 'var(--navy)' : 'var(--fg-2)',
              boxShadow: tab === id ? '0 2px 12px rgba(15,34,68,0.10)' : 'none', transition: 'all 0.2s',
            }}>{lbl}</button>
          ))}
        </div>

        <div style={{ background: '#fff', borderRadius: 24, padding: 'clamp(24px, 4vw, 40px)',
          boxShadow: '0 8px 40px rgba(15,34,68,0.08)', border: '1px solid var(--border)' }}>
          {tab === 'fin' ? (
            <React.Fragment>
              <div style={{ display: 'grid', gap: 24, gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', marginBottom: 32 }}>
                {[
                  { l: 'Valor do imóvel', v: vF, s: setVF, min: 300000, max: 15000000, step: 50000, f: v => fmtBRL(v) },
                  { l: 'Entrada (%)', v: entF, s: setEntF, min: 10, max: 70, step: 5, f: v => v + '%' },
                  { l: 'Prazo (meses)', v: prazoF, s: setPrazoF, min: 60, max: 420, step: 12, f: v => v + ' meses (' + Math.round(v/12) + ' anos)' },
                  { l: 'Taxa anual', v: taxaF, s: setTaxaF, min: 6, max: 18, step: 0.5, f: v => v.toFixed(1) + '% a.a.' },
                ].map(f => (
                  <div key={f.l}>
                    <div style={{ fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700, letterSpacing: '0.1em',
                      textTransform: 'uppercase', color: 'var(--fg-2)', marginBottom: 6 }}>{f.l}</div>
                    <div style={{ fontFamily: 'Playfair Display', fontSize: 20, fontWeight: 700,
                      color: 'var(--gold)', marginBottom: 8 }}>{f.f(f.v)}</div>
                    <input type="range" min={f.min} max={f.max} step={f.step} value={f.v}
                      onChange={e => f.s(Number(e.target.value))}
                      style={{ width: '100%', accentColor: 'var(--gold)', cursor: 'pointer' }} />
                  </div>
                ))}
              </div>
              <div style={{ display: 'grid', gap: 16, gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                background: 'var(--cream)', borderRadius: 16, padding: '20px 24px' }}>
                {[
                  { l: 'Valor financiado', v: fmtBRL(Math.round(principal)) },
                  { l: 'Parcela mensal', v: fmtBRL(Math.round(parcela)), accent: true },
                  { l: 'Total pago', v: fmtBRL(Math.round(totalPago)) },
                  { l: 'Total em juros', v: fmtBRL(Math.round(totalPago - vF)) },
                ].map(r => (
                  <div key={r.l} style={{ textAlign: 'center' }}>
                    <div style={{ fontFamily: 'Playfair Display', fontSize: r.accent ? 28 : 20,
                      fontWeight: 700, color: r.accent ? 'var(--gold)' : 'var(--navy)', lineHeight: 1 }}>{r.v}</div>
                    <div style={{ fontFamily: 'DM Sans', fontSize: 10.5, fontWeight: 600,
                      letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--fg-2)', marginTop: 6 }}>{r.l}</div>
                  </div>
                ))}
              </div>
              <p style={{ fontSize: 11.5, color: 'var(--fg-2)', marginTop: 12, marginBottom: 0 }}>
                * Simulação SAC — parcelas decrescentes. Consulte condições reais junto ao banco.
              </p>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div style={{ display: 'grid', gap: 24, gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', marginBottom: 32 }}>
                {[
                  { l: 'Valor do imóvel', v: vI, s: setVI, min: 300000, max: 15000000, step: 50000, f: v => fmtBRL(v) },
                  { l: 'Valorização anual (%)', v: valI, s: setValI, min: 3, max: 25, step: 0.5, f: v => v.toFixed(1) + '% a.a.' },
                  { l: 'Horizonte (anos)', v: anosI, s: setAnosI, min: 1, max: 20, step: 1, f: v => v + ' anos' },
                  { l: 'Rendimento aluguel/mês', v: alugI, s: setAlugI, min: 0, max: 1.5, step: 0.05, f: v => v.toFixed(2) + '% a.m.' },
                ].map(f => (

  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
