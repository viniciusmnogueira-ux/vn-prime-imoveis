<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VN Prime Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400;1,9..40,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<style>/* ==========================================================================
   VN Prime Imóveis — Colors & Type Tokens
   Display: Playfair Display  ·  Body: DM Sans  ·  Brand word: Cinzel
   ========================================================================== */

@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

:root {
  /* ---------- Brand base ---------- */
  --navy:            #0F2244;   /* Marinha — primary brand */
  --navy-soft:       #162A52;
  --navy-muted:      #1E3560;
  --gold:            #C9960E;   /* Dourado — accent */
  --gold-soft:       #D4A84A;
  --gold-bright:     #F5D78E;   /* gradient highlight */
  --gold-deep:       #A07830;   /* gradient shadow */

  /* ---------- Surfaces ---------- */
  --cream:           #FAF8F4;   /* off-white page bg */
  --white:           #FFFFFF;
  --surface:         #FFFFFF;
  --surface-alt:     #FAF8F4;

  /* ---------- Text ---------- */
  --fg-1:            #1A1A1A;   /* body */
  --fg-2:            #5C6478;   /* muted, secondary */
  --fg-3:            rgba(15, 34, 68, 0.55);
  --fg-on-navy:      #FAF8F4;
  --fg-on-navy-2:    rgba(250, 249, 246, 0.85);

  /* ---------- Borders ---------- */
  --border:          rgba(15, 34, 68, 0.12);
  --border-strong:   rgba(15, 34, 68, 0.22);

  /* ---------- Profile accents (adaptive UI) ---------- */
  --profile-owner:   #C9960E;   /* Proprietário — Ouro */
  --profile-broker:  #059669;   /* Corretor — Esmeralda */
  --profile-photo:   #B87333;   /* Fotógrafo — Bronze */
  --profile-admin:   #0F2244;   /* Administração — Marinho */

  /* ---------- Semantic status ---------- */
  --status-pending-bg:     #FEF3C7;
  --status-pending-fg:     #92400E;
  --status-approved-bg:    #D1FAE5;
  --status-approved-fg:    #065F46;
  --status-plan-bg:        #E0E7FF;
  --status-plan-fg:        #3730A3;

  /* ---------- Elevation ---------- */
  --shadow-card:     0 8px 32px rgba(15, 34, 68, 0.08);
  --shadow-soft:     0 18px 50px rgba(15, 34, 68, 0.12);
  --shadow-accent:   0 4px 24px rgba(201, 150, 14, 0.35);
  --shadow-navy:     0 4px 20px rgba(15, 34, 68, 0.25);
  --shadow-featured: 0 12px 40px rgba(201, 150, 14, 0.20);

  /* ---------- Radii ---------- */
  --radius-sm:       8px;
  --radius-md:       14px;
  --radius-lg:       22px;
  --radius-pill:     999px;

  /* ---------- Spacing scale ---------- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 2.5rem;
  --space-8: 3rem;

  /* ---------- Type families ---------- */
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:    "DM Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --font-brand:   "Cinzel", Georgia, serif;   /* VN PRIME wordmark only */

  /* ---------- Signature gradients ---------- */
  --gradient-gold:       linear-gradient(145deg,#F5D78E 0%,#C9A84C 45%,#A07830 62%,#C9A84C 100%);
  --gradient-gold-line:  linear-gradient(90deg,#B8892A,#D4A84A,#B8892A);
  --gradient-navy-hero:  linear-gradient(135deg,#0F2244 0%,#162A52 45%,#1E3560 100%);
  --gradient-navy-fact:  linear-gradient(90deg,#0F2244,#1E3560);

  /* ---------- Dynamic accent (profile-adaptive) ---------- */
  --accent:          var(--gold);
  --accent-contrast: var(--navy);
}

[data-profile="owner"]  { --accent: var(--profile-owner);  --accent-contrast: #0F2244; }
[data-profile="broker"] { --accent: var(--profile-broker); --accent-contrast: #FFFFFF; }
[data-profile="photo"]  { --accent: var(--profile-photo);  --accent-contrast: #0F2244; }
[data-profile="admin"]  { --accent: var(--profile-admin);  --accent-contrast: #C9960E; }

/* ============================================================
   Semantic type styles
   ============================================================ */

html { color-scheme: light; }

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--fg-1);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.2;
  color: var(--navy);
  margin: 0 0 0.5em;
}

h1 { font-size: clamp(2.25rem, 4vw, 3.25rem); }
h2 { font-size: clamp(1.75rem, 3vw, 2.35rem); }
h3 { font-size: 1.35rem; }
h4 { font-size: 1.1rem; }

p { margin: 0 0 1em; color: var(--fg-2); }

small, .text-xs { font-size: 0.75rem; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-soft);
}

.subsection-label {
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.label-caps {
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-2);
}

.lead {
  font-family: var(--font-body);
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--fg-2);
}

.price {
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--accent);
  margin: 0.5rem 0;
}

.muted { color: var(--fg-2); }

code {
  font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
  background: rgba(15, 34, 68, 0.06);
  padding: 0.1em 0.35em;
  border-radius: 4px;
}

/* Brand wordmark helper — VN PRIME only */
.wordmark-vn {
  font-family: var(--font-brand);
  font-weight: 700;
  letter-spacing: 0.05em;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.wordmark-prime {
  font-family: var(--font-brand);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--navy);
}
.wordmark-imoveis {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.58em;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  background: var(--gradient-gold-line);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
</style>
<script type="text/babel">// Shared chrome — header, footer, brand mark, buttons, pills, formatters
const { useState, useEffect, useRef, useMemo } = React;

const fmtBRL = (n) => 'R$ ' + new Intl.NumberFormat('pt-BR').format(n);
const fmtBRLshort = (n) => {
  if (n >= 1_000_000) return 'R$ ' + (n / 1_000_000).toFixed(n % 1_000_000 === 0 ? 0 : 1).replace('.', ',') + ' mi';
  if (n >= 1_000) return 'R$ ' + Math.round(n / 1_000) + ' mil';
  return fmtBRL(n);
};

function ShieldMark({ size = 28 }) {
  return (
    <svg width={size} height={size * 1.13} viewBox="0 0 44 50" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="goldShield" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#F5D78E"/>
          <stop offset="45%" stopColor="#C9A84C"/>
          <stop offset="62%" stopColor="#A07830"/>
          <stop offset="100%" stopColor="#C9A84C"/>
        </linearGradient>
      </defs>
      <path d="M22 1 L42 6 V24 C42 36 33 45 22 49 C11 45 2 36 2 24 V6 Z"
        stroke="url(#goldShield)" strokeWidth="2.2" fill="rgba(201,150,14,0.05)"/>
      <text x="22" y="32" textAnchor="middle"
        fontFamily="Cinzel, serif" fontSize="18" fontWeight="700"
        fill="url(#goldShield)" letterSpacing="0.03em">VN</text>
    </svg>
  );
}

function BrandLockup({ onNavy = false }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <ShieldMark size={32} />
      <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1 }}>
        <span style={{ fontFamily: 'Cinzel, serif', fontWeight: 700, fontSize: 18, letterSpacing: '0.14em',
          color: onNavy ? '#fff' : 'var(--navy)' }}>VN PRIME</span>
        <span style={{ fontFamily: 'DM Sans', fontWeight: 600, fontSize: 9, letterSpacing: '0.42em',
          background: 'linear-gradient(90deg,#B8892A,#D4A84A,#B8892A)',
          WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent', marginTop: 4 }}>IMÓVEIS</span>
      </div>
    </div>
  );
}

function Btn({ variant = 'primary', size = 'md', children, onClick, type, style = {}, fullWidth = false }) {
  const sizes = {
    md: { padding: '0.75rem 1.35rem', fontSize: 14 },
    sm: { padding: '0.5rem 0.95rem', fontSize: 12.5 },
    lg: { padding: '0.95rem 1.7rem', fontSize: 15 },
    xs: { padding: '0.35rem 0.7rem', fontSize: 11.5 },
  };
  const variants = {
    primary: { background: 'var(--navy)', color: 'var(--cream)', boxShadow: '0 4px 20px rgba(15,34,68,0.25)' },
    accent:  { background: 'var(--gold)', color: 'var(--navy)', boxShadow: '0 4px 24px rgba(201,150,14,0.35)', fontWeight: 700 },
    ghost:   { background: 'transparent', color: 'var(--navy)', border: '1px solid var(--border-strong)' },
    ghostOnNavy: { background: 'rgba(255,255,255,0.06)', color: '#fff', border: '1px solid rgba(250,249,246,0.4)' },
    text:    { background: 'transparent', color: 'var(--navy)', boxShadow: 'none' },
  };
  return (
    <button
      type={type || 'button'}
      onClick={onClick}
      style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        fontFamily: 'DM Sans, sans-serif', fontWeight: 600, border: 'none', cursor: 'pointer',
        borderRadius: 8, transition: 'transform 0.15s ease, box-shadow 0.2s, background 0.2s, filter 0.2s',
        width: fullWidth ? '100%' : undefined,
        ...sizes[size], ...variants[variant], ...style,
      }}
      onMouseEnter={(e) => { e.currentTarget.style.filter = 'brightness(1.04)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.filter = 'none'; }}
      onMouseDown={(e) => { e.currentTarget.style.transform = 'scale(0.98)'; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
    >{children}</button>
  );
}

function Eyebrow({ children, color }) {
  return (
    <div style={{ fontFamily: 'DM Sans', fontSize: 11.5, fontWeight: 700,
      letterSpacing: '0.14em', textTransform: 'uppercase', color: color || 'var(--gold-soft)',
      marginBottom: 10 }}>{children}</div>
  );
}

// ImovelWeb-style operation tabs (Comprar / Vender)
function OperationTabs({ value, onChange }) {
  const tabs = [
    { id: 'compra', label: 'Comprar' },
    { id: 'venda',  label: 'Vender' },
  ];
  return (
    <div style={{ display: 'inline-flex', background: 'rgba(15,34,68,0.55)',
      borderRadius: 10, padding: 4, gap: 2, border: '1px solid rgba(255,255,255,0.12)' }}>
      {tabs.map(t => {
        const active = value === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            style={{
              fontFamily: 'DM Sans', fontSize: 13, fontWeight: 600,
              padding: '0.55rem 1.1rem', borderRadius: 7, cursor: 'pointer', border: 'none',
              background: active ? 'var(--gold)' : 'transparent',
              color: active ? 'var(--navy)' : 'rgba(250,249,246,0.85)',
              letterSpacing: '0.02em',
              transition: 'background 0.15s ease, color 0.15s ease',
            }}>{t.label}</button>
        );
      })}
    </div>
  );
}

function Pill({ children, tone = 'gold', solid = false, style = {} }) {
  const tones = {
    gold: { bg: solid ? 'var(--gold)' : 'rgba(201,150,14,0.15)', fg: solid ? 'var(--navy)' : 'var(--navy)' },
    navy: { bg: solid ? 'var(--navy)' : 'rgba(15,34,68,0.08)', fg: solid ? '#fff' : 'var(--navy)' },
    new:  { bg: '#065F46', fg: '#fff' },
    featured: { bg: 'var(--gold)', fg: 'var(--navy)' },
  };
  const t = tones[tone] || tones.gold;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      fontFamily: 'DM Sans', fontSize: 10.5, fontWeight: 700, letterSpacing: '0.1em',
      textTransform: 'uppercase', padding: '4px 10px', borderRadius: 999,
      background: t.bg, color: t.fg, ...style,
    }}>{children}</span>
  );
}

// Site header — sticky w/ blur
const ROLE_PORTAL = {
  proprietario: 'portal',
  corretor:     'corretor',
  fotografo:    'fotografo',
  comprador:    'busca',
};
const ROLE_AVATAR_COLOR = {
  proprietario: 'var(--gold)',
  corretor:     '#059669',
  fotografo:    '#B87333',
  comprador:    'var(--navy)',
};
const ROLE_CTA = {
  proprietario: { label: 'Anunciar imóvel', route: 'anunciar' },
  corretor:     { label: 'Meu portal',           route: 'corretor' },
  fotografo:    { label: 'Meus jobs',            route: 'fotografo' },
  comprador:    { label: 'Anunciar imóvel', route: null },
};

const SERVICOS_ITEMS = [
  { id: 'proprietario',   label: 'Área do Proprietário', desc: 'Anuncie seu imóvel — taxa fixa ou comissão' },
  { id: 'corretor-canal', label: 'Portal do Corretor',   desc: 'Leads, CRM e portfólio premium de BH' },
  { id: 'consorcio',      label: 'Consórcio',            desc: 'Compre sem juros com carta de crédito' },
  { id: 'due-diligence',  label: 'Due Diligence',        desc: 'Análise jurídica e técnica antes de comprar' },
  { id: 'fotografo-canal',label: 'Fotógrafo',            desc: 'Fotografia e mídias para imóveis de alto padrão' },
];

function SiteHeader({ active, onNav, density = 'comfortable', authUser, onAuthOpen, onLogout }) {
  const pad = density === 'compact' ? '10px 0' : '14px 0';
  const [mobileOpen, setMobileOpen] = React.useState(false);
  const [openDrop, setOpenDrop] = React.useState(null);
  const [servicosMob, setServicosMob] = React.useState(false);
  const navRef = React.useRef(null);

  const portalRoute = authUser ? (ROLE_PORTAL[authUser.role] || 'portal') : null;
  const avatarColor = authUser ? (ROLE_AVATAR_COLOR[authUser.role] || 'var(--gold)') : null;
  const cta = authUser ? (ROLE_CTA[authUser.role] || ROLE_CTA.comprador) : null;

  const handleCta = () => {
    setMobileOpen(false);
    if (!authUser) { onNav('vender'); return; }
    if (cta.route) onNav(cta.route);
  };
  const go = (id) => { setMobileOpen(false); setOpenDrop(null); setServicosMob(false); onNav(id); };

  React.useEffect(() => { setMobileOpen(false); setOpenDrop(null); }, [active]);

  React.useEffect(() => {
    if (!openDrop) return;
    const handler = (e) => {
      if (navRef.current && !navRef.current.contains(e.target)) setOpenDrop(null);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [openDrop]);

  const navItems = [
    { id: 'home',        label: 'Início' },
    { id: 'busca',       label: 'Comprar' },
    { id: 'vender',      label: 'Vender' },
    { id: 'lancamentos', label: 'Lançamentos' },
    { id: 'sobre',       label: 'Sobre' },
  ];

  const servicosActive = ['anunciar', 'proprietario', 'corretor', 'corretor-canal', 'portal', 'consorcio', 'due-diligence', 'fotografo-canal', 'fotografo'].includes(active);

  const linkBase = (isActive) => ({
    fontFamily: 'DM Sans', fontSize: 13.5, fontWeight: 500, cursor: 'pointer',
    color: isActive ? 'var(--gold)' : 'var(--navy-muted)',
    borderBottom: isActive ? '2px solid var(--gold)' : '2px solid transparent',
    padding: '4px 0', textDecoration: 'none', whiteSpace: 'nowrap',
  });

  function DropMenu({ items }) {
    return (
      <div style={{
        position: 'absolute', top: 'calc(100% + 12px)', left: 0,
        background: '#fff', borderRadius: 14, padding: '8px',
        boxShadow: '0 20px 56px rgba(15,34,68,0.18), 0 0 0 1px rgba(15,34,68,0.08)',
        minWidth: 240, zIndex: 200,
      }}>
        <div style={{ position: 'absolute', top: -7, left: 24, width: 0, height: 0,
          borderLeft: '7px solid transparent', borderRight: '7px solid transparent',
          borderBottom: '7px solid #fff',
          filter: 'drop-shadow(0 -1px 0 rgba(15,34,68,0.06))',
        }} />
        {items.map(it => (
          <button key={it.id} onClick={() => go(it.id)} style={{
            display: 'block', width: '100%', padding: '10px 14px',
            borderRadius: 8, border: 'none',
            background: active === it.id ? 'rgba(201,150,14,0.08)' : 'transparent',
            cursor: 'pointer', textAlign: 'left', transition: 'background 0.12s',
          }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(15,34,68,0.04)'}
          onMouseLeave={e => e.currentTarget.style.background = active === it.id ? 'rgba(201,150,14,0.08)' : 'transparent'}
          >
            <div style={{ fontFamily: 'DM Sans', fontWeight: 700, fontSize: 13.5,
              color: active === it.id ? 'var(--gold)' : 'var(--navy)', marginBottom: 2 }}>{it.label}</div>
            <div style={{ fontSize: 11.5, color: 'var(--fg-2)', lineHeight: 1.4 }}>{it.desc}</div>
          </button>
        ))}
      </div>
    );
  }

  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 100,
      background: 'rgba(250,249,246,0.97)', backdropFilter: 'blur(12px)',
      borderBottom: '1px solid var(--border)',
    }}>
      <div ref={navRef} style={{ width: 'min(1280px, 94vw)', margin: '0 auto', display: 'flex',
        alignItems: 'center', justifyContent: 'space-between', padding: pad, gap: 16 }}>

        {/* Logo */}
        <a onClick={(e) => { e.preventDefault(); go('home'); }}
           style={{ display: 'flex', alignItems: 'center', textDecoration: 'none', cursor: 'pointer', flexShrink: 0 }}>
          <BrandLockup />
        </a>

        {/* Desktop nav */}
        <nav className="vnp-nav-desktop" style={{ alignItems: 'center', gap: 22 }}>
          {navItems.map(it => (
            <a key={it.id} onClick={(e) => { e.preventDefault(); go(it.id); }}
               style={linkBase(active === it.id)}>{it.label}</a>
          ))}

          {/* SERVICOS dropdown */}
          <div style={{ position: 'relative' }}>
            <button onClick={() => setOpenDrop(o => o === 'servicos' ? null : 'servicos')} style={{
              ...linkBase(servicosActive),
              display: 'inline-flex', alignItems: 'center', gap: 4,
              background: 'none', border: 'none', cursor: 'pointer', padding: '4px 0',
            }}>
              Serviços
              <span style={{ fontSize: 9, opacity: 0.65, display: 'inline-block',
                transform: openDrop === 'servicos' ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }}>{'▾'}</span>
            </button>
            {openDrop === 'servicos' && <DropMenu items={SERVICOS_ITEMS} />}
          </div>

          <span style={{ width: 1, height: 22, background: 'var(--border)' }} />

          {authUser ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <a onClick={() => go(portalRoute)} style={{
                fontFamily: 'DM Sans', fontSize: 13, fontWeight: 600,
                color: 'var(--navy)', cursor: 'pointer', textDecoration: 'none',
                display: 'flex', alignItems: 'center', gap: 7,
              }}>
                <span style={{
                  width: 30, height: 30, borderRadius: '50%',
                  background: avatarColor, color: '#fff',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontWeight: 700, fontSize: 13,
                }}>{authUser.name.charAt(0).toUpperCase()}</span>
                {authUser.name.split(' ')[0]}
              </a>
              {(authUser.email === 'vinicius.mnogueira@gmail.com' || authUser.role === 'admin') && (
                <a onClick={() => go('admin')} title="Portal Admin" style={{
                  fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700, letterSpacing: '0.06em',
                  color: 'var(--gold)', cursor: 'pointer', textDecoration: 'none',
                  padding: '4px 10px', borderRadius: 6,
                  background: 'rgba(201,150,14,0.1)', border: '1px solid rgba(201,150,14,0.3)',
                }}>ADMIN</a>
              )}
              <button onClick={onLogout} style={{
                border: 'none', background: 'none', cursor: 'pointer',
                fontFamily: 'DM Sans', fontSize: 12, color: 'var(--fg-2)',
              }}>Sair</button>
            </div>
          ) : (
            <button onClick={() => onAuthOpen('entrar')} style={{
              fontFamily: 'DM Sans', fontSize: 13, fontWeight: 600, letterSpacing: '0.05em',
              color: 'var(--navy)', border: '1.5px solid rgba(15,34,68,0.25)',
              background: 'transparent', borderRadius: 8, padding: '6px 16px',
              cursor: 'pointer', transition: 'border-color 0.15s, background 0.15s',
            }}>ENTRAR</button>
          )}
          <Btn size="sm" variant="accent" onClick={handleCta}>

              color: servicosActive ? 'var(--gold)' : 'var(--navy)',
              background: servicosActive ? 'rgba(201,150,14,0.08)' : 'transparent',
              border: 'none', cursor: 'pointer', textAlign: 'left',

              <div style={{ paddingLeft: 16, paddingTop: 4, display: 'flex', flexDirection: 'column', gap: 2 }}>
                {SERVICOS_ITEMS.map(s => (
                  <a key={s.id} onClick={() => go(s.id)} style={{
                    padding: '10px 16px', borderRadius: 8,
                    fontFamily: 'DM Sans', fontSize: 14, fontWeight: active === s.id ? 700 : 400,
                    color: active === s.id ? 'var(--gold)' : 'var(--navy)',
                    background: active === s.id ? 'rgba(201,150,14,0.08)' : 'transparent',
                    cursor: 'pointer', textDecoration: 'none', display: 'block',
                  }}>{s.label}</a>
                ))}

        <div style={{ height: 1, background: 'var(--border)', marginBottom: 20 }} />

        {authUser ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '0 4px', marginBottom: 4 }}>
              <span style={{
                width: 40, height: 40, borderRadius: '50%',
                background: avatarColor, color: '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontWeight: 800, fontSize: 16, flexShrink: 0,
              }}>{authUser.name.charAt(0).toUpperCase()}</span>

                <div style={{ fontSize: 12, color: 'var(--fg-2)', textTransform: 'capitalize' }}>{authUser.role}</div>
              </div>
            </div>
            <button onClick={() => go(portalRoute)} style={{
              padding: '13px', background: 'var(--navy)', color: '#fff',
              border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 15, cursor: 'pointer',
            }}>Meu portal</button>
            <button onClick={() => { setMobileOpen(false); onLogout(); }} style={{
              padding: '11px', background: 'transparent', color: 'var(--fg-2)',
              border: '1px solid var(--border)', borderRadius: 10, fontWeight: 500, fontSize: 14, cursor: 'pointer',
            }}>Sair</button>

        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <button onClick={() => { setMobileOpen(false); onAuthOpen('entrar'); }} style={{
              padding: '13px', background: 'transparent', color: 'var(--navy)',
              border: '1.5px solid var(--border)', borderRadius: 10, fontWeight: 600, fontSize: 15, cursor: 'pointer',
            }}>ENTRAR</button>
            <button onClick={handleCta} style={{
              padding: '13px',
              background: 'linear-gradient(135deg, var(--gold) 0%, #e6a800 100%)',
              color: '#fff', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 15, cursor: 'pointer',
            }}>Anunciar grátis</button>
          </div>
        )}
      </div>
    </header>
  );
}

// Auth modal — login + criar conta (com seleção de perfil)
const ROLES = [
  { id: 'proprietario', label: 'Proprietário', desc: 'Quero anunciar meu imóvel', initial: 'P', accent: 'var(--gold)' },
  { id: 'corretor',     label: 'Corretor',          desc: 'Sou parceiro VN Prime',      initial: 'C', accent: '#059669' },
  { id: 'fotografo',    label: 'Fotógrafo',    desc: 'Ofereço serviços de mídia', initial: 'F', accent: '#B87333' },
  { id: 'comprador',    label: 'Comprador',          desc: 'Quero encontrar um imóvel', initial: 'B', accent: 'var(--navy)' },
];

const ROLE_LABELS = { proprietario: 'Proprietário', corretor: 'Corretor', fotografo: 'Fotógrafo', comprador: 'Comprador' };

function AuthModal({ isOpen, defaultTab = 'entrar', onClose, onAuth, presetRole = null }) {
  const [tab, setTab] = useState(defaultTab);
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ name: '', email: '', phone: '', password: '' });
  const [role, setRole] = useState(presetRole || '');
  const [error, setError] = useState('');
  const [showPass, setShowPass] = useState(false);

  useEffect(() => {
    setTab(defaultTab);
    setStep(1);
    setError('');
    setRole(presetRole || '');
    setShowPass(false);
  }, [defaultTab, presetRole, isOpen]);

  if (!isOpen) return null;

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const handleStep1 = (e) => {
    e.preventDefault();
    setError('');
    if (!form.name.trim() || !form.email.trim() || !form.phone.trim() || !form.password.trim()) {
      setError('Preencha todos os campos obrigatórios.'); return;
    }
    if (presetRole) {
      // Role already determined — skip selection step
      const user = { name: form.name.trim(), email: form.email.trim(), phone: form.phone.trim(), role: presetRole };
      localStorage.setItem('vnprime_user', JSON.stringify(user));
      onAuth(user); return;
    }
    setStep(2);
  };

  const handleFinish = () => {
    if (!role) { setError('Selecione seu perfil para continuar.'); return; }
    const user = {
      name: form.name.trim(),
      email: form.email.trim(),
      phone: form.phone.trim(),
      role,
    };
    localStorage.setItem('vnprime_user', JSON.stringify(user));
    onAuth(user);
  };

  const handleLogin = (e) => {
    e.preventDefault();
    setError('');
    const stored = localStorage.getItem('vnprime_user');
    if (stored) {
      const user = JSON.parse(stored);
      if (user.email === form.email.trim()) { onAuth(user); return; }
    }
    setError('E-mail não encontrado. Crie uma conta para continuar.');
  };

  const handleGoogleLogin = () => {
    if (typeof google === 'undefined') {
      setError('Login com Google não disponível. Tente pelo formulário.');
      return;
    }
    google.accounts.id.initialize({
      client_id: 'YOUR_GOOGLE_CLIENT_ID',
      callback: (response) => {
        try {
          const payload = JSON.parse(atob(response.credential.split('.')[1]));
          setForm(f => ({ ...f, name: payload.name || '', email: payload.email || '' }));
          setTab('criar');
          setStep(2);
        } catch {
          setError('Erro ao processar login Google. Tente novamente.');
        }
      },
    });
    google.accounts.id.prompt();
  };

  const fl = { display: 'flex', flexDirection: 'column', gap: 6 };
  const lb = {
    fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700,
    letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--fg-2)',
  };

  return (
    <div onClick={(e) => { if (e.target === e.currentTarget) onClose(); }} style={{
      position: 'fixed', inset: 0, zIndex: 500,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 20, background: 'rgba(15,34,68,0.58)', backdropFilter: 'blur(5px)',
    }}>
      <div style={{
        background: '#fff', borderRadius: 20, padding: '2rem',
        width: '100%', maxWidth: 460,
        boxShadow: '0 28px 64px rgba(15,34,68,0.24)', position: 'relative',
      }}>
        <button onClick={onClose} style={{
          position: 'absolute', top: 16, right: 16, border: 'none',
          background: 'none', cursor: 'pointer', fontSize: 20, color: 'var(--fg-2)', lineHeight: 1,
        }}>{'✕'}</button>

        <div style={{ textAlign: 'center', marginBottom: presetRole ? 12 : 24 }}><BrandLockup /></div>

        {/* Role context badge */}
        {presetRole && (
          <div style={{ textAlign: 'center', marginBottom: 18 }}>
            <span style={{
              display: 'inline-block', padding: '4px 14px', borderRadius: 999,
              background: presetRole === 'corretor' ? '#05966918' : presetRole === 'fotografo' ? '#B8733318' : 'var(--gold-soft)18',
              border: `1px solid ${presetRole === 'corretor' ? '#05966930' : presetRole === 'fotografo' ? '#B8733330' : 'var(--gold)30'}`,
              fontFamily: 'DM Sans', fontSize: 12, fontWeight: 700, letterSpacing: '0.08em',
              textTransform: 'uppercase',
              color: presetRole === 'corretor' ? '#059669' : presetRole === 'fotografo' ? '#B87333' : 'var(--gold)',
            }}>
              Área do {ROLE_LABELS[presetRole] || presetRole}
            </span>
          </div>
        )}

        {/* Tabs */}
        {step === 1 && (
          <div style={{ display: 'flex', borderBottom: '1px solid var(--border)', marginBottom: 24 }}>
            {[['entrar', 'Entrar'], ['criar', 'Criar conta']].map(([id, label]) => (
              <button key={id} onClick={() => { setTab(id); setError(''); }} style={{
                flex: 1, padding: '0.65rem', border: 'none', background: 'none', cursor: 'pointer',
                fontFamily: 'DM Sans', fontSize: 14, fontWeight: 600,
                color: tab === id ? 'var(--gold)' : 'var(--fg-2)',
                borderBottom: tab === id ? '2px solid var(--gold)' : '2px solid transparent',
                marginBottom: -1,
              }}>{label}</button>
            ))}
          </div>
        )}

        {/* STEP 2 — Seleção de perfil */}
        {tab === 'criar' && step === 2 ? (
          <div>
            <p style={{ fontFamily: 'DM Sans', fontWeight: 600, fontSize: 15, color: 'var(--navy)', margin: '0 0 6px', textAlign: 'center' }}>
              Olá, {form.name.split(' ')[0]}! Quem é você?
            </p>
            <p style={{ fontSize: 13, color: 'var(--fg-2)', textAlign: 'center', margin: '0 0 20px' }}>
              Vamos personalizar sua experiência na plataforma.
            </p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
              {ROLES.map(r => (
                <button key={r.id} type="button" onClick={() => { setRole(r.id); setError(''); }} style={{
                  border: `2px solid ${role === r.id ? r.accent : 'var(--border)'}`,
                  borderRadius: 14, padding: '18px 14px', cursor: 'pointer', background: '#fff',
                  textAlign: 'center', transition: 'border-color 0.15s, box-shadow 0.15s',
                  boxShadow: role === r.id ? `0 0 0 3px ${r.accent}22` : 'none',
                }}>
                  <div style={{
                    width: 44, height: 44, borderRadius: '50%', margin: '0 auto 10px',
                    background: role === r.id ? r.accent : r.accent + '18',
                    border: `2px solid ${r.accent}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: 'Cinzel, serif', fontWeight: 700, fontSize: 16,
                    color: role === r.id ? '#fff' : r.accent,
                    transition: 'background 0.15s, color 0.15s',
                  }}>{r.initial}</div>
                  <div style={{ fontFamily: 'DM Sans', fontWeight: 700, fontSize: 14, color: 'var(--navy)', marginBottom: 4 }}>
                    {r.label}
                  </div>
                  <div style={{ fontSize: 11.5, color: 'var(--fg-2)', lineHeight: 1.4 }}>{r.desc}</div>
                </button>
              ))}
            </div>
            {error && <p style={{ color: '#dc2626', fontSize: 13, margin: '0 0 12px' }}>{error}</p>}
            <Btn variant="accent" fullWidth onClick={handleFinish}>
              Criar minha conta {'→'}
            </Btn>
            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <button type="button" onClick={() => { setStep(1); setError(''); }} style={{
                border: 'none', background: 'none', cursor: 'pointer',
                fontSize: 13, color: 'var(--fg-2)', textDecoration: 'underline',
              }}>{'←'} Voltar</button>
            </div>
          </div>
        ) : (
          /* STEP 1 — Formulário */
          <form onSubmit={tab === 'criar' ? handleStep1 : handleLogin}
            style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            {tab === 'criar' && (
              <div style={fl}>
                <label style={lb}>Nome completo *</label>
                <input type="text" value={form.name} onChange={set('name')} placeholder="Seu nome completo" required />
              </div>
            )}
            <div style={fl}>
              <label style={lb}>E-mail *</label>
              <input type="email" value={form.email} onChange={set('email')} placeholder="seu@email.com" required />
            </div>
            {tab === 'criar' && (
              <div style={fl}>
                <label style={lb}>WhatsApp *</label>
                <input type="tel" value={form.phone} onChange={set('phone')} placeholder="(31) 99999-9999" required />
              </div>
            )}
            <div style={fl}>
              <label style={lb}>Senha *</label>
              <div style={{ position: 'relative' }}>
                <input type={showPass ? 'text' : 'password'} value={form.password} onChange={set('password')}
                  placeholder={showPass ? 'sua senha' : '••••••••'}
                  required style={{ width: '100%', paddingRight: 40, boxSizing: 'border-box' }} />
                <button type="button" onClick={() => setShowPass(v => !v)} style={{
                  position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)',
                  border: 'none', background: 'none', cursor: 'pointer', padding: 4, color: 'var(--fg-2)',
                  display: 'flex', alignItems: 'center',
                }}>
                  {showPass ? (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  ) : (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  )}
                </button>
              </div>
            </div>

            {error && <p style={{ color: '#dc2626', fontSize: 13, margin: 0 }}>{error}</p>}

            {tab === 'criar' && (
              <p style={{ fontSize: 12, color: 'var(--fg-2)', margin: 0, lineHeight: 1.6 }}>
                Ao criar sua conta você concorda com os{' '}
                <a href="#" style={{ color: 'var(--gold)' }}>termos de uso</a> e{' '}
                <a href="#" style={{ color: 'var(--gold)' }}>política de privacidade</a>.
              </p>
            )}

            <Btn type="submit" variant="accent" fullWidth style={{ marginTop: 4 }}>
              {tab === 'entrar' ? 'Entrar na plataforma' : 'Continuar →'}
            </Btn>

            {/* Divider */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
              <span style={{ fontSize: 11, color: 'var(--fg-2)', whiteSpace: 'nowrap' }}>ou continue com</span>
              <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
            </div>

            {/* Google OAuth */}
            <button type="button" onClick={handleGoogleLogin} style={{
              width: '100%', padding: '11px', border: '1.5px solid var(--border)',
              borderRadius: 8, background: '#fff', cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
              fontFamily: 'DM Sans', fontWeight: 600, fontSize: 14, color: 'var(--navy)',
              transition: 'border-color 0.15s',
            }}
            onMouseEnter={e => e.currentTarget.style.borderColor = 'rgba(15,34,68,0.4)'}
            onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border)'}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Google
            </button>

            <div style={{ textAlign: 'center' }}>
              <button type="button" onClick={() => { setTab(tab === 'entrar' ? 'criar' : 'entrar'); setError(''); }}
                style={{ border: 'none', background: 'none', cursor: 'pointer', fontSize: 13, color: 'var(--navy)', textDecoration: 'underline' }}>
                {tab === 'entrar' ? 'Ainda não tem conta? Criar agora' : 'Já tenho uma conta'}
              </button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

// Property feature row (icons + numbers) — used on cards & detail
function FeatureRow({ areaM2, quartos, suites, vagas, banheiros, compact = false }) {
  const items = [
    { icon: '⌿', val: areaM2, lbl: 'm²' },
    { icon: '⌂', val: quartos, lbl: quartos === 1 ? 'qto' : 'qtos' },
    { icon: '✦', val: suites, lbl: suites === 1 ? 'suíte' : 'suítes' },
    { icon: '⛌', val: vagas, lbl: vagas === 1 ? 'vaga' : 'vagas' },
  ];
  if (banheiros !== undefined) items.splice(3, 0, { icon: '☂', val: banheiros, lbl: banheiros === 1 ? 'banh.' : 'banhs.' });
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: compact ? 12 : 18,
      fontFamily: 'DM Sans', fontSize: compact ? 12 : 13, color: 'var(--fg-2)' }}>
      {items.map((it, i) => (
        <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
          <span style={{ color: 'var(--gold)', fontSize: compact ? 13 : 15, lineHeight: 1 }}>{it.icon}</span>
          <b style={{ color: 'var(--navy)', fontWeight: 600 }}>{it.val}</b>
          <span>{it.lbl}</span>
        </span>
      ))}
    </div>
  );
}

// ─── Calculadoras ────────────────────────────────────────────────────────────
function Calculadoras() {
  const [tab, setTab] = React.useState('fin');
  // financiamento state
  const [vF, setVF] = React.useState(1200000);
  const [entF, setEntF] = React.useState(20);
  const [prazoF, setPrazoF] = React.useState(360);
  const [taxaF, setTaxaF] = React.useState(10.5);
  // investimento state
  const [vI, setVI] = React.useState(1200000);
  const [valI, setValI] = React.useState(12);
  const [anosI, setAnosI] = React.useState(4);
  const [alugI, setAlugI] = React.useState(0.5);

  // financiamento calc
  const principal = vF * (1 - entF / 100);
  const tmens = taxaF / 100 / 12;
  const parcela = principal * (tmens * Math.pow(1 + tmens, prazoF)) / (Math.pow(1 + tmens, prazoF) - 1);
  const totalPago = parcela * prazoF + vF * (entF / 100);

  // investimento calc
  const vFinal = vI * Math.pow(1 + valI / 100, anosI);
  const ganho = vFinal - vI;
  const alugueis = vI * (alugI / 100) * 12 * anosI;

  return (
    <section style={{ padding: 'clamp(3rem, 6vw, 5rem) 0', background: 'var(--cream)' }}>
      <div style={{ width: 'min(1280px, 94vw)', margin: '0 auto' }}>
        <div style={{ textAlign: 'center', maxWidth: 600, margin: '0 auto 40px' }}>
          <Eyebrow color="var(--gold)">Ferramentas · Planejamento</Eyebrow>
          <h2 style={{ margin: '8px 0 12px' }}>Calcule e planeje sua compra</h2>
          <p style={{ color: 'var(--fg-2)', fontSize: 15, lineHeight: 1.7, margin: 0 }}>
            Simule o financiamento ou projete a valorização do seu investimento ao longo do tempo.
          </p>
        </div>

        <div style={{ display: 'flex', gap: 4, background: '#e8e4da', borderRadius: 14,
          padding: 4, width: 'fit-content', margin: '0 auto 32px' }}>
          {[['fin', 'Simulador de Financiamento'], ['inv', 'Retorno do Investimento']].map(([id, lbl]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              padding: '11px 22px', borderRadius: 10, border: 'none', cursor: 'pointer',
              fontFamily: 'DM Sans', fontSize: 13.5, fontWeight: 600,
              background: tab === id ? '#fff' : 'transparent',
              color: tab === id ? 'var(--navy)' : 'var(--fg-2)',
              boxShadow: tab === id ? '0 2px 12px rgba(15,34,68,0.10)' : 'none', transition: 'all 0.2s',
            }}>{lbl}</button>
          ))}
        </div>

        <div style={{ background: '#fff', borderRadius: 24, padding: 'clamp(24px, 4vw, 40px)',
          boxShadow: '0 8px 40px rgba(15,34,68,0.08)', border: '1px solid var(--border)' }}>
          {tab === 'fin' ? (
            <React.Fragment>
              <div style={{ display: 'grid', gap: 24, gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', marginBottom: 32 }}>
                {[
                  { l: 'Valor do imóvel', v: vF, s: setVF, min: 300000, max: 15000000, step: 50000, f: v => fmtBRL(v) },
                  { l: 'Entrada (%)', v: entF, s: setEntF, min: 10, max: 70, step: 5, f: v => v + '%' },
                  { l: 'Prazo (meses)', v: prazoF, s: setPrazoF, min: 60, max: 420, step: 12, f: v => v + ' meses (' + Math.round(v/12) + ' anos)' },
                  { l: 'Taxa anual', v: taxaF, s: setTaxaF, min: 6, max: 18, step: 0.5, f: v => v.toFixed(1) + '% a.a.' },
                ].map(f => (
                  <div key={f.l}>

                      textTransform: 'uppercase', color: 'var(--fg-2)', marginBottom: 6 }}>{f.l}</div>

                  </div>
                ))}
              </div>
              <div style={{ display: 'grid', gap: 16, gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                background: 'var(--cream)', borderRadius: 16, padding: '20px 24px' }}>
                {[
                  { l: 'Valor financiado', v: fmtBRL(Math.round(principal)) },
                  { l: 'Parcela mensal', v: fmtBRL(Math.round(parcela)), accent: true },
                  { l: 'Total pago', v: fmtBRL(Math.round(totalPago)) },
                  { l: 'Total em juros', v: fmtBRL(Math.round(totalPago - vF)) },

              <div style={{ display: 'grid', gap: 24, gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', marginBottom: 32 }}>
                {[
                  { l: 'Valor do imóvel', v: vI, s: setVI, min: 300000, max: 15000000, step: 50000, f: v => fmtBRL(v) },

                  { l: 'Rendimento aluguel/mês', v: alugI, s: setAlugI, min: 0, max: 1.5, step: 0.05, f: v => v.toFixed(2) + '% a.m.' },
                ].map(f => (
                  <div key={f.l}>
                    <div style={{ fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700, letterSpacing: '0.1em',
                      textTransform: 'uppercase', color: 'var(--fg-2)', marginBottom: 6 }}>{f.l}</div>

                      color: 'var(--gold)', marginBottom: 8 }}>{f.f(f.v)}</div>
                    <input type="range" min={f.min} max={f.max} step={f.step} value={f.v}
                      onChange={e => f.s(Number(e.target.value))}
                      style={{ width: '100%', accentColor: 'var(--gold)', cursor: 'pointer' }} />
                  </div>
                ))}
              </div>
              {/* gráfico de barras */}
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontFamily: 'DM Sans', fontSize: 11, fontWeight: 700, letterSpacing: '0.1em',
                  textTransform: 'uppercase', color: 'var(--fg-2)', marginBottom: 12 }}>Evolução do valor</div>
                <div style={{ display: 'flex', alignItems: 'flex-end', gap: 5, height: 100, padding: '0 4px' }}>
                  {Array.from({ length: anosI + 1 }, (_, i) => {
                    const v = vI * Math.pow(1 + valI / 100, i);
                    const vMax = vI * Math.pow(1 + valI / 100, anosI);
                    return (
                      <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                        <div style={{
                          width: '100%', borderRadius: '4px 4px 0 0',
                          height: (v / vMax) * 84,
                          background: i === anosI ? 'var(--gold)' : 'rgba(201,150,14,' + (0.25 + (i / anosI) * 0.6) + ')',
                          transition: 'height 0.4s ease',
                        }} />
                        <span style={{ fontSize: 9, color: 'var(--fg-2)', fontWeight: 600 }}>
                          {i === 0 ? 'Hoje' : i + 'a'}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
              <div style={{ display: 'grid', gap: 16, gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                background: 'var(--cream)', borderRadius: 16, padding: '20px 24px' }}>
                {[
                  { l: 'Valor hoje', v: fmtBRL(vI) },
                  { l: `Valor em ${anosI} anos`, v: fmtBRL(Math.round(vFinal)), accent: true },
                  { l: 'Ganho de capital', v: fmtBRL(Math.round(ganho)) },
                  { l: 'Receita aluguel', v: fmtBRL(Math.round(alugueis)) },
                  { l: 'Retorno total', v: (((ganho + alugueis) / vI) * 100).toFixed(1) + '%' },
                ].map(r => (
                  <div key={r.l} style={{ textAlign: 'center' }}>
                    <div style={{ fontFamily: 'Playfair Display', fontSize: r.accent ? 26 : 18,
                      fontWeight: 700, color: r.accent ? 'var(--gold)' : 'var(--navy)', lineHeight: 1 }}>{r.v}</div>
                    <div style={{ fontFamily: 'DM Sans', fontSize: 10.5, fontWeight: 600,
                      letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--fg-2)', marginTop: 6 }}>{r.l}</div>
                  </div>
                ))}
              </div>
              <p style={{ fontSize: 11.5, color: 'var(--fg-2)', marginTop: 12, marginBottom: 0 }}>
                * Projeção baseada em valorização constante. Referência indicativa — não constitui promessa de rentabilidade.
              </p>
            </React.Fragment>
          )}
        </div>
      </div>
    </section>
  );
}

<script type="text/babel">// Consórcio Imobiliário — VN Prime
// Rota: consorcio | Exporta: window.ConsorcioPage

(function () {

const CONS_GREEN  = '#059669';
const CONS_LIME   = '#6ee7b7';
const CONS_GOLD   = 'var(--gold)';

function fmtBRL(n) {
  if (!n && n !== 0) return '—';
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
}

// ─── Wizard 5 passos ─────────────────────────────────────────────────────────
function ConsWizard() {
  const [step, setStep]       = React.useState(1);
  const [cat,  setCat]        = React.useState(null);
  const [valor, setValor]     = React.useState(500000);
  const [prazo, setPrazo]     = React.useState(120);
  const [dados, setDados]     = React.useState({ nome: '', tel: '', email: '' });
  const [sent,  setSent]      = React.useState(false);

  const taxaAdm = 0.16;
  const parcela  = Math.round(valor * (1 + taxaAdm) / prazo);
  const economia = Math.round(valor * 0.72);

  const cats = [
    {
      id: 'imovel', label: 'Imóvel',
      icon: (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
      ),
    },
    {
      id: 'veiculo', label: 'Veículo',
      icon: (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <path d="M5 17H3a2 2 0 01-2-2V9a2 2 0 012-2h1l2-4h8l2 4h1a2 2 0 012 2v6a2 2 0 01-2 2h-2"/>
          <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
        </svg>
      ),
    },
    {
      id: 'outros', label: 'Outros bens',
      icon: (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
      ),
    },
  ];

  const catMax = cat === 'veiculo' ? 350000 : cat === 'outros' ? 200000 : 2000000;
  const catMin = cat === 'veiculo' ? 30000  : cat === 'outros' ? 10000  : 100000;
  const catStep = cat === 'veiculo' ? 10000 : cat === 'outros' ? 5000   : 50000;

  const inputSt = {
    width: '100%', marginBottom: 10, padding: '10px 14px',
    borderRadius: 9, border: '1.5px solid rgba(255,255,255,0.15)',
    background: 'rgba(255,255,255,0.07)', color: '#fff',
    fontFamily: 'DM Sans', fontSize: 13.5, outline: 'none', boxSizing: 'border-box',
  };

  const nextBtn = (label, onClick, disabled) => (
    <button onClick={onClick} disabled={disabled} style={{
      width: '100%', padding: '12px', background: disabled ? 'rgba(5,150,105,0.35)' : CONS_GREEN,
      color: '#fff', border: 'none', borderRadius: 10, fontFamily: 'DM Sans',
      fontWeight: 700, fontSize: 14, cursor: disabled ? 'default' : 'pointer', marginTop: 4,
    }}>{label}</button>
  );

  const backBtn = (toStep) => (
    <button onClick={() => setStep(toStep)} style={{
      background: 'transparent', color: 'rgba(250,249,246,0.45)', border: 'none',
      fontFamily: 'DM Sans', fontSize: 12, cursor: 'pointer', padding: '6px 0', display: 'block',
    }}>← Voltar</button>
  );

  const progress = sent ? 100 : ((step - 1) / 4) * 100;

  return (
    <div style={{ background: 'rgba(255,255,255,0.07)', backdropFilter: 'blur(14px)',
      border: '1px solid rgba(255,255,255,0.14)', borderRadius: 20, padding: 28 }}>

      {/* Header + progress */}
      <div style={{ fontFamily: 'DM Sans', fontSize: 10, fontWeight: 700,
        letterSpacing: '0.14em', textTransform: 'uppercase', color: CONS_LIME, marginBottom: 12 }}>
        Simulador inteligente
      </div>
      <div style={{ fontFamily: 'DM Sans', fontSize: 15, fontWeight: 700, color: '#fff', marginBottom: 6 }}>
        {sent ? 'Proposta enviada!' : 'Monte seu consórcio ideal'}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 5 }}>
        <span style={{ fontSize: 10.5, color: 'rgba(250,249,246,0.45)', fontFamily: 'DM Sans' }}>
          {sent ? 'Concluído' : `PASSO ${step} DE 5`}
        </span>
        <span style={{ fontSize: 10.5, color: 'rgba(250,249,246,0.45)', fontFamily: 'DM Sans' }}>
          {Math.round(progress)}% concluído
        </span>
      </div>
      <div style={{ height: 3, background: 'rgba(255,255,255,0.1)', borderRadius: 99, marginBottom: 22 }}>
        <div style={{ height: '100%', borderRadius: 99, background: CONS_GREEN,
          width: progress + '%', transition: 'width 0.35s ease' }} />
      </div>

      {/* Step 1 — categoria */}
      {!sent && step === 1 && (
        <div>
          <div style={{ fontFamily: 'DM Sans', fontSize: 14.5, fontWeight: 600, color: 'rgba(250,249,246,0.9)', marginBottom: 16 }}>
            O que você quer consoriar?
          </div>
          <div style={{ display: 'flex', gap: 10, marginBottom: 8 }}>
            {cats.map(c => (
              <button key={c.id} onClick={() => { setCat(c.id); if (c.id !== 'imovel') setValor(c.id === 'veiculo' ? 80000 : 30000); setStep(2); }}
                style={{ flex: 1, padding: '16px 8px', borderRadius: 12, textAlign: 'center',
                  border: `1.5px solid ${cat === c.id ? CONS_GREEN : 'rgba(255,255,255,0.14)'}`,
                  background: cat === c.id ? `rgba(5,150,105,0.2)` : 'rgba(255,255,255,0.04)',
                  color: '#fff', cursor: 'pointer', fontFamily: 'DM Sans', fontWeight: 600,
                  fontSize: 12.5, transition: 'all 0.2s' }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = CONS_GREEN; e.currentTarget.style.background = 'rgba(5,150,105,0.15)'; }}
                onMouseLeave={e => { if (cat !== c.id) { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.14)'; e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; } }}>
                <div style={{ color: CONS_LIME, marginBottom: 8 }}>{c.icon}</div>
                {c.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Step 2 — valor */}
      {!sent && step === 2 && (
        <div>
          <div style={{ fontFamily: 'DM Sans', fontSize: 14.5, fontWeight: 600, color: 'rgba(250,249,246,0.9)', marginBottom: 14 }}>
            Qual o valor da carta?
          </div>
          <div style={{ fontFamily: 'Playfair Display', fontSize: 32, fontWeight: 700,
            color: '#fcd34d', lineHeight: 1, marginBottom: 14 }}>{fmtBRL(valor)}</div>
          <input type="range" min={catMin} max={catMax} step={catStep}
            value={Math.min(valor, catMax)} onChange={e => setValor(+e.target.value)}
            style={{ width: '100%', accentColor: CONS_GREEN, marginBottom: 6 }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11,
            color: 'rgba(250,249,246,0.4)', marginBottom: 20, fontFamily: 'DM Sans' }}>
            <span>{fmtBRL(catMin)}</span><span>{fmtBRL(catMax)}</span>
          </div>
          {nextBtn('Continuar →', () => setStep(3))}
          {backBtn(1)}
        </div>
      )}

      {/* Step 3 — prazo + preview */}
      {!sent && step === 3 && (
        <div>
          <div style={{ fontFamily: 'DM Sans', fontSize: 14.5, fontWeight: 600, color: 'rgba(250,249,246,0.9)', marginBottom: 14 }}>
            Escolha o prazo
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 16 }}>
            {[60, 84, 120, 180].map(p => (
              <button key={p} onClick={() => setPrazo(p)} style={{
                padding: '12px 8px', borderRadius: 10, border: `1.5px solid ${prazo === p ? CONS_GREEN : 'rgba(255,255,255,0.15)'}`,
                background: prazo === p ? `rgba(5,150,105,0.25)` : 'rgba(255,255,255,0.05)',
                color: '#fff', cursor: 'pointer', fontFamily: 'DM Sans',
                fontWeight: prazo === p ? 700 : 500, fontSize: 13, textAlign: 'center',
                transition: 'all 0.15s',
              }}>
                <div style={{ fontSize: 18, fontWeight: 700, color: prazo === p ? CONS_LIME : '#fff' }}>{p}</div>
                <div style={{ fontSize: 10, color: 'rgba(250,249,246,0.5)', marginTop: 2 }}>meses · {Math.round(p/12)} anos</div>
              </button>
            ))}
          </div>
          <div style={{ background: 'rgba(255,255,255,0.06)', borderRadius: 12, padding: '14px 16px', marginBottom: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <span style={{ fontSize: 12, color: 'rgba(250,249,246,0.55)', fontFamily: 'DM Sans' }}>Parcela estimada</span>
              <span style={{ fontFamily: 'Playfair Display', fontSize: 17, fontWeight: 700, color: CONS_LIME }}>{fmtBRL(parcela)}/mês</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 12, color: 'rgba(250,249,246,0.55)', fontFamily: 'DM Sans' }}>Economia vs. financiamento</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: '#fcd34d', fontFamily: 'DM Sans' }}>~{fmtBRL(economia)}</span>
            </div>
          </div>
          {nextBtn('Continuar →', () => setStep(4))}
          {backBtn(2)}
        </div>
      )}

      {/* Step 4 — dados */}
      {!sent && step === 4 && (
        <div>
          <div style={{ fontFamily: 'DM Sans', fontSize: 14.5, fontWeight: 600, color: 'rgba(250,249,246,0.9)', marginBottom: 14 }}>
            Seus dados para a proposta
          </div>
          {[['nome','Nome completo','text'],['tel','WhatsApp / Telefone','tel'],['email','E-mail','email']].map(([k,ph,t]) => (
            <input key={k} type={t} placeholder={ph} value={dados[k]}
              onChange={e => setDados(d => ({ ...d, [k]: e.target.value }))}
              style={inputSt} />
          ))}
          {nextBtn('Receber proposta →', () => setSent(true), !dados.nome || !dados.tel)}
          {backBtn(3)}
        </div>
      )}

      {/* Step 5 — confirmação */}
      {sent && (
        <div style={{ textAlign: 'center', paddingTop: 8 }}>
          <div style={{ width: 52, height: 52, borderRadius: '50%', background: CONS_GREEN,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            margin: '0 auto 14px', fontSize: 22, color: '#fff', fontWeight: 700 }}>✓</div>
          <p style={{ color: 'rgba(250,249,246,0.75)', fontSize: 13.5, margin: '0 0 18px', lineHeight: 1.65 }}>
            Um consultor VN Prime entrará em contato em até 24h com sua proposta personalizada.
          </p>
          <div style={{ background: `rgba(5,150,105,0.15)`, border: `1px solid rgba(5,150,105,0.35)`,
            borderRadius: 10, padding: '10px 16px', fontSize: 12.5, color: CONS_LIME, fontWeight: 600 }}>
            Parceiro oficial Ademicon · Regulamentado BACEN
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Hero ─────────────────────────────────────────────────────────────────────

function DDEtapasAnalise() {
  const [open, setOpen] = React.useState(null);
  const [ai,   setAi]   = React.useState({});

  const upAi = (id, patch) => setAi(p => ({ ...p, [id]: { ...p[id], ...patch } }));

  const analisar = (id) => {
    const s = ai[id] || {};
    if (!s.desc) return;
    upAi(id, { loading: true, result: null });
    setTimeout(() => {
      const t = ((s.desc || '') + ' ' + (s.tipo || '') + ' ' + (s.valor || '')).toLowerCase();
      let risco = 'baixo';
      if (/fraude|indisponibilidade judicial|recupera[çc][ãa]o judicial|fal[eê]ncia|bloqueio/.test(t)) risco = 'crítico';
      else if (/a[çc][ãa]o judicial|processo|penhora|execu[çc][ãa]o|hipoteca ativa|aliena[çc][ãa]o/.test(t)) risco = 'alto';
      else if (/protesto|atraso|pend[eê]ncia|d[eé]bito|irregularidade|em aberto/.test(t)) risco = 'médio';
      const textos = {

                  border: lead.status === 'Novo' ? '1px solid rgba(201,150,14,0.35)' : '1px solid var(--border)',
                  boxShadow: '0 2px 12px rgba(15,34,68,0.06)',

                  <div style={{
                    width: 10, height: 10, borderRadius: '50%', flexShrink: 0,
                    background: lead.status === 'Novo' ? 'var(--gold)' : lead.status === 'Enviado' ? '#059669' : '#6366F1',
                  }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--navy)', marginBottom: 4 }}>
                      {lead.nome}
                    </div>
                    <div style={{ fontSize: 12.5, color: 'var(--fg-2)', display: 'flex', gap: 18, flexWrap: 'wrap' }}>
                      <span>{lead.email}</span>
                      <span>{lead.telefone}</span>
                      <span>Carta: <b style={{ color: 'var(--gold)' }}>{lead.carta}</b></span>
                      <span>Parcela: <b style={{ color: 'var(--navy)' }}>{lead.parcela}</b></span>
                      <span>Prazo: {lead.prazo}</span>
                      <span>Data: {lead.data}</span>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
                    <span style={{
                      padding: '4px 12px', borderRadius: 99, fontSize: 11.5, fontWeight: 700,
                      background: lead.status === 'Novo' ? 'rgba(201,150,14,0.12)' :
                                  lead.status === 'Enviado' ? 'rgba(5,150,105,0.12)' : 'rgba(99,102,241,0.12)',
                      color: lead.status === 'Novo' ? '#92600A' :
                             lead.status === 'Enviado' ? '#065F46' : '#4338CA',
                    }}>{lead.status}</span>
                    <button onClick={() => setEmailModal(lead)} style={{
                      padding: '7px 16px', background: 'var(--navy)', color: '#fff',
                      border: 'none', borderRadius: 7, fontWeight: 700, fontSize: 12.5, cursor: 'pointer',
                    }}>Enviar para parceiro</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── TAB: AGENDA ── */}
        {tab === 'agenda' && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>
              <h2 style={{ margin: 0, fontSize: 18, color: 'var(--navy)' }}>
                Calendário
                <span style={{ marginLeft: 10, fontFamily: 'DM Sans', fontSize: 13, fontWeight: 400, color: 'var(--fg-2)' }}>

                </span>
              </h2>
              <div style={{ display: 'flex', gap: 8 }}>
                {[['visita','Visita','#2563EB'],['foto','Foto','#B87333'],['reuniao','Reunião','#7C3AED']].map(([tipo, label, cor]) => (
                  <span key={tipo} style={{ padding: '3px 10px', borderRadius: 99, fontSize: 11.5, fontWeight: 700,
                    background: cor + '15', color: cor }}>
                    {label}: {agenda.filter(e => e.tipo === tipo).length}
                  </span>
                ))}
              </div>
            </div>

            {Object.entries(
              agenda.reduce((acc, e) => { if (!acc[e.data]) acc[e.data] = []; acc[e.data].push(e); return acc; }, {})

                  <span style={{ fontSize: 11.5, color: 'var(--fg-2)' }}>{eventos.length} evento{eventos.length > 1 ? 's' : ''}</span>

                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>

                    const tipoInfo = { visita: { cor: '#2563EB', lbl: 'Visita' }, foto: { cor: '#B87333', lbl: 'Fotografia' }, reuniao: { cor: '#7C3AED', lbl: 'Reunião' } };

              </div>

                const tipoColors = { visita: '#2563EB', foto: '#B87333', reuniao: '#7C3AED' };

                return (
                  <div key={ev.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '9px 0', borderBottom: i < arr.length - 1 ? '1px solid var(--border)' : 'none' }}>
                    <span style={{ padding: '2px 8px', borderRadius: 99, fontSize: 10.5, fontWeight: 700, background: cor + '15', color: cor, flexShrink: 0 }}>{tipoLabels[ev.tipo]}</span>
                    <div style={{ flex: 1, fontSize: 13, color: 'var(--navy)', fontWeight: 500 }}>{ev.imovel || ev.obs}</div>

                      background: ev.status === 'confirmada' ? '#05966912' : 'rgba(201,150,14,0.12)',
                      color: ev.status === 'confirmada' ? '#065F46' : '#92600A' }}>{ev.status}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

      </div>

      {/* Email modal */}
      {emailModal && (
        <div onClick={(e) => { if (e.target === e.currentTarget) setEmailModal(null); }} style={{
          position: 'fixed', inset: 0, zIndex: 600,
          background: 'rgba(15,34,68,0.72)', backdropFilter: 'blur(6px)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20,
        }}>
          <div style={{ background: '#fff', borderRadius: 20, overflow: 'hidden',
            width: '100%', maxWidth: 680, boxShadow: '0 32px 80px rgba(15,34,68,0.28)', position: 'relative' }}>
            <div style={{ background: 'var(--navy)', padding: '22px 28px',
              display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div style={{ fontFamily: 'DM Sans', fontSize: 10, fontWeight: 700,
                  letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--gold-soft)', marginBottom: 4 }}>
                  Email profissional · Lead qualificado
                </div>
                <div style={{ color: '#fff', fontFamily: 'Playfair Display', fontSize: 18, fontWeight: 600 }}>
                  Enviar lead para Ademicon
                </div>
              </div>
              <button onClick={() => setEmailModal(null)} style={{
                border: 'none', background: 'rgba(255,255,255,0.12)',
                color: '#fff', borderRadius: 8, padding: '6px 12px', cursor: 'pointer', fontSize: 18 }}>✕</button>
            </div>

            <div style={{ padding: '28px 32px' }}>
              <div style={{ background: 'var(--cream)', borderRadius: 14, padding: '24px 28px',
                border: '2px solid var(--border)', fontFamily: 'DM Sans', fontSize: 14, lineHeight: 1.75 }}>
                {/* Email preview */}
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 20, paddingBottom: 16, borderBottom: '1px solid var(--border)' }}>
                  <div>
                    <div style={{ fontSize: 11, color: 'var(--fg-2)', fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 2 }}>De</div>
                    <div style={{ fontWeight: 600, color: 'var(--navy)' }}>VN Prime Imóveis &lt;parceiros@vnprime.com.br&gt;</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: 11, color: 'var(--fg-2)', fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 2 }}>Para</div>
                    <div style={{ fontWeight: 600, color: 'var(--navy)' }}>Comercial Ademicon &lt;leads@ademicon.com.br&gt;</div>
                  </div>
                </div>
                <div style={{ fontWeight: 800, fontSize: 16, color: 'var(--navy)', marginBottom: 16 }}>
                  Novo lead qualificado — Consórcio Imobiliário VN Prime
                </div>
                <p style={{ color: 'var(--fg-2)', margin: '0 0 16px' }}>Prezados,</p>

                  Encaminhou-se um lead qualificado captado via portal VN Prime Imóveis. O interessado passou por simulação
                  interativa e manifestou interesse em receber uma proposta oficial de consórcio imobiliário.

                    ['Nome completo', emailModal.nome],

              <div style={{ display: 'flex', gap: 10, marginTop: 20, justifyContent: 'flex-end' }}>

                  const idx = copy.findIndex(l => l.id === emailModal.id);
                  if (idx > -1) copy[idx] = { ...copy[idx], status: 'Enviado' };
                  setConsLeads(copy);
                  setEmailModal(null);
                  showToast('Lead enviado para Ademicon com sucesso');
                }} style={{
                  padding: '10px 24px', background: 'var(--navy)', color: '#fff',

window.AdminPage = AdminPage;

})();
</script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "compact",
  "accentMode": "gold",
  "cardStyle": "elevated",
  "headlineFont": "Cinzel",
  "showFeaturedRibbon": true
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = React.useState({ name: 'home', params: {} });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [authUser, setAuthUser] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('vnprime_user')); } catch { return null; }
  });
  const [authModal, setAuthModal] = React.useState({ open: false, tab: 'entrar', pendingNav: null, presetRole: null });

  const onAuthOpen = (tab = 'entrar', pendingNav = null, presetRole = null) => {
    setAuthModal({ open: true, tab, pendingNav, presetRole });
  };
  const onAuthClose = () => setAuthModal(m => ({ ...m, open: false, pendingNav: null, presetRole: null }));
  const roleDestination = (role) => {
    if (role === 'proprietario') return 'anunciar';
    if (role === 'corretor')    return 'corretor';
    if (role === 'fotografo')   return 'fotografo';
    return 'busca';
  };

  const onAuth = (user) => {
    setAuthUser(user);
    onAuthClose();
    // Always route to the user's role destination — enforces portal isolation
    setRoute({ name: roleDestination(user.role), params: {} });
  };
  const onLogout = () => {
    localStorage.removeItem('vnprime_user');
    setAuthUser(null);
    setRoute({ name: 'home', params: {} });
  };

  const routeRole = { anunciar: 'proprietario', corretor: 'corretor', fotografo: 'fotografo' };
  const onNav = (name, params = {}) => {
    const protectedRoutes = ['anunciar', 'portal', 'corretor', 'fotografo'];
    if (protectedRoutes.includes(name)) {
      if (!authUser) {
        onAuthOpen('entrar', name, routeRole[name] || null); return;
      }
      // Role guard: logged-in users can only access their own portal
      if (routeRole[name] && authUser.role !== routeRole[name]) {
        const myRoute = roleDestination(authUser.role);
        setRoute({ name: myRoute, params: {} });
        window.scrollTo({ top: 0, behavior: 'instant' }); return;
      }
    }
    setRoute({ name, params });
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  // Apply tweaks to root scope
  React.useEffect(() => {
    const root = document.documentElement;
    const accents = {
      gold: { '--accent': '#C9960E', '--gold': '#C9960E', '--gold-soft': '#D4A84A' },
      emerald: { '--accent': '#059669', '--gold': '#059669', '--gold-soft': '#10B981' },
      bronze: { '--accent': '#B87333', '--gold': '#B87333', '--gold-soft': '#D08F4F' },
    };
    const a = accents[tweaks.accentMode] || accents.gold;
    Object.entries(a).forEach(([k, v]) => root.style.setProperty(k, v));
    if (tweaks.headlineFont) {
      root.style.setProperty('--font-display', `"${tweaks.headlineFont}", Georgia, serif`);
    }
  }, [tweaks.accentMode, tweaks.headlineFont]);

  const headerActive = route.name === 'busca' && route.params.op === 'lancamento'
    ? 'lancamentos' : route.name;

  return (
    <React.Fragment>
      <AuthModal isOpen={authModal.open} defaultTab={authModal.tab} presetRole={authModal.presetRole} onClose={onAuthClose} onAuth={onAuth} />
      <SiteHeader active={headerActive} onNav={onNav} density={tweaks.density}
        authUser={authUser} onAuthOpen={onAuthOpen} onLogout={onLogout} />

      {route.name === 'home' && (
        <HomePage onNav={onNav} density={tweaks.density} accentMode={tweaks.accentMode} />
      )}
      {route.name === 'busca' && (
        <SearchResultsPage onNav={onNav} initial={route.params} density={tweaks.density} />
      )}
      {route.name === 'detalhe' && (
        <PropertyDetailPage id={route.params.id} onNav={onNav} />
      )}
      {route.name === 'vender' && React.createElement(window.VenderHubPage, { onNav })}
      {route.name === 'anunciar' && React.createElement(window.AnunciarPage, { onNav, authUser })}
      {route.name === 'portal'    && React.createElement(window.PortalPage,    { onNav, authUser })}
      {route.name === 'corretor'  && React.createElement(window.CorretorPage,  { onNav, authUser })}
      {route.name === 'fotografo' && React.createElement(window.FotografoPage, { onNav, authUser })}
      {route.name === 'sobre' && React.createElement(window.SobrePage, { onNav })}
      {route.name === 'proprietario'    && React.createElement(window.ProprietarioPage,    { onNav })}
      {route.name === 'corretor-canal'  && React.createElement(window.CorretorCanalPage,  { onNav })}
      {route.name === 'fotografo-canal' && React.createElement(window.FotografoCanalPage, { onNav })}
      {route.name === 'lancamentos' && React.createElement(window.LancamentosPage, { onNav })}
      {route.name === 'aluguel' && (
        <PlaceholderPage name="aluguel" onNav={onNav} />
      )}
      {route.name === 'consorcio' && React.createElement(window.ConsorcioPage, { onNav, authUser, onAuthOpen })}
      {route.name === 'due-diligence' && React.createElement(window.DueDiligencePage, { onNav })}
      {route.name === 'admin' && React.createElement(window.AdminPage, { onNav, authUser })}

      <SiteFooter onNav={onNav} />

      {/* WhatsApp flutuante global */}
      <a onClick={() => window.open('https://wa.me/5531984144250?text=' + encodeURIComponent('Olá! Vi a VN Prime Imóveis e gostaria de mais informações.'), '_blank')}
        style={{ position: 'fixed', bottom: 24, right: 24, zIndex: 400,
          width: 56, height: 56, borderRadius: '50%', background: '#25d366',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 8px 28px rgba(37,211,102,0.45)', cursor: 'pointer',
          fontSize: 26, textDecoration: 'none', transition: 'transform 0.2s, box-shadow 0.2s' }}
        onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.1)'; e.currentTarget.style.boxShadow = '0 12px 36px rgba(37,211,102,0.55)'; }}
        onMouseLeave={e => { e.currentTarget.style.transform = 'none'; e.currentTarget.style.boxShadow = '0 8px 28px rgba(37,211,102,0.45)'; }}
        title="Falar no WhatsApp">💬</a>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Layout">
          <TweakRadio label="Densidade" value={tweaks.density}
            options={[{value:'compact', label:'Compacto'}, {value:'comfortable', label:'Confortável'}]}
            onChange={(v) => setTweak('density', v)} />
        </TweakSection>
        <TweakSection title="Identidade">
          <TweakRadio label="Cor de destaque" value={tweaks.accentMode}
            options={[
              {value:'gold', label:'Dourado'},
              {value:'emerald', label:'Esmeralda'},
              {value:'bronze', label:'Bronze'},
            ]}
            onChange={(v) => setTweak('accentMode', v)} />
          <TweakSelect label="Fonte de display" value={tweaks.headlineFont}
            options={[
              {value:'Playfair Display', label:'Playfair Display (padrão)'},
              {value:'Cinzel', label:'Cinzel (mais luxo)'},
              {value:'DM Serif Display', label:'DM Serif Display'},
            ]}
            onChange={(v) => setTweak('headlineFont', v)} />
        </TweakSection>
        <TweakSection title="Navegação rápida">
          <TweakButton onClick={() => onNav('home')}>Home</TweakButton>
          <TweakButton onClick={() => onNav('busca')}>Busca</TweakButton>
          <TweakButton onClick={() => onNav('detalhe', { id: 'vn-4401' })}>Detalhe</TweakButton>
          <TweakButton onClick={() => onNav('vender')}>Vender hub</TweakButton>
          <TweakButton onClick={() => onNav('anunciar')}>Anunciar</TweakButton>
          <TweakButton onClick={() => onNav('portal')}>Portal proprietário</TweakButton>
          <TweakButton onClick={() => onNav('corretor')}>Portal corretor</TweakButton>
          <TweakButton onClick={() => onNav('fotografo')}>Portal fotógrafo</TweakButton>
          <TweakButton onClick={() => onNav('sobre')}>Sobre</TweakButton>
          <TweakButton onClick={() => onNav('lancamentos')}>Lançamentos</TweakButton>
          <TweakButton onClick={() => onNav('proprietario')}>Canal proprietário</TweakButton>
          <TweakButton onClick={() => onNav('corretor-canal')}>Canal corretor</TweakButton>
          <TweakButton onClick={() => onNav('fotografo-canal')}>Canal fotógrafo</TweakButton>
          <TweakButton onClick={() => onNav('consorcio')}>Consórcio</TweakButton>
          <TweakButton onClick={() => onNav('due-diligence')}>Due Diligence</TweakButton>
          <TweakButton onClick={() => onNav('admin')}>Admin</TweakButton>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

function PlaceholderPage({ name, onNav }) {
  const labels = {
    aluguel:   ['Imóveis para alugar',  'Veja nossos imóveis em aluguel na busca.'],
    consorcio: ['Consórcio Imobiliário', 'Compre sem juros com carta de crédito VN Prime. Página em breve.'],
  };
  const [t, p] = labels[name] || ['Página', 'Em construção'];
  return (
    <main style={{ padding: '80px 20px', textAlign: 'center', minHeight: '60vh' }}>
      <Eyebrow color="var(--gold)">VN Prime · {name}</Eyebrow>
      <h1>{t}</h1>
      <p style={{ color: 'var(--fg-2)', maxWidth: 480, margin: '0 auto 24px' }}>{p}</p>
      <Btn variant="accent" onClick={() => onNav(name === 'aluguel' ? 'busca' : name === 'lancamentos' ? 'busca' : 'home',
        name === 'aluguel' ? { op: 'aluguel' } : name === 'lancamentos' ? { op: 'lancamento' } : {})}>
        {name === 'aluguel' || name === 'lancamentos' ? 'Ver imóveis' : 'Voltar para o início'}
      </Btn>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
