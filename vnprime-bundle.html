// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "compact",
  "accentMode": "gold",
  "cardStyle": "elevated",
  "headlineFont": "Cinzel",
  "showFeaturedRibbon": true
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = React.useState({ name: 'home', params: {} });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [authUser, setAuthUser] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('vnprime_user')); } catch { return null; }
  });
  const [authModal, setAuthModal] = React.useState({ open: false, tab: 'entrar', pendingNav: null });

  const onAuthOpen = (tab = 'entrar', pendingNav = null) => {
    setAuthModal({ open: true, tab, pendingNav });
  };
  const onAuthClose = () => setAuthModal(m => ({ ...m, open: false, pendingNav: null }));
  const roleDestination = (role) => {
    if (role === 'proprietario') return 'anunciar';
    if (role === 'corretor')    return 'corretor';
    if (role === 'fotografo')   return 'fotografo';
    return 'busca';
  };

  const onAuth = (user) => {
    setAuthUser(user);
    const pending = authModal.pendingNav;
    onAuthClose();
    if (pending) { setRoute({ name: pending, params: {} }); return; }
    if (user.role) { setRoute({ name: roleDestination(user.role), params: {} }); return; }
  };
  const onLogout = () => {
    localStorage.removeItem('vnprime_user');
    setAuthUser(null);
    setRoute({ name: 'home', params: {} });
  };

  const onNav = (name, params = {}) => {
    const protectedRoutes = ['anunciar', 'portal', 'corretor', 'fotografo'];
    if (protectedRoutes.includes(name) && !authUser) {
      onAuthOpen('entrar', name); return;
    }
    setRoute({ name, params });
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  // Apply tweaks to root scope
  React.useEffect(() => {
    const root = document.documentElement;
    const accents = {
      gold: { '--accent': '#C9960E', '--gold': '#C9960E', '--gold-soft': '#D4A84A' },
      emerald: { '--accent': '#059669', '--gold': '#059669', '--gold-soft': '#10B981' },
      bronze: { '--accent': '#B87333', '--gold': '#B87333', '--gold-soft': '#D08F4F' },
    };
    const a = accents[tweaks.accentMode] || accents.gold;
    Object.entries(a).forEach(([k, v]) => root.style.setProperty(k, v));
    if (tweaks.headlineFont) {
      root.style.setProperty('--font-display', `"${tweaks.headlineFont}", Georgia, serif`);
    }
  }, [tweaks.accentMode, tweaks.headlineFont]);

  const headerActive = route.name === 'busca' && route.params.op === 'lancamento'
    ? 'lancamentos' : route.name;

  return (
    <React.Fragment>
      <AuthModal isOpen={authModal.open} defaultTab={authModal.tab} onClose={onAuthClose} onAuth={onAuth} />
      <SiteHeader active={headerActive} onNav={onNav} density={tweaks.density}
        authUser={authUser} onAuthOpen={onAuthOpen} onLogout={onLogout} />

      {route.name === 'home' && (
        <HomePage onNav={onNav} density={tweaks.density} accentMode={tweaks.accentMode} />
      )}
      {route.name === 'busca' && (
        <SearchResultsPage onNav={onNav} initial={route.params} density={tweaks.density} />
      )}
      {route.name === 'detalhe' && (
        <PropertyDetailPage id={route.params.id} onNav={onNav} />
      )}
      {route.name === 'vender' && React.createElement(window.VenderHubPage, { onNav })}
      {route.name === 'anunciar' && React.createElement(window.AnunciarPage, { onNav, authUser })}
      {route.name === 'portal'    && React.createElement(window.PortalPage,    { onNav, authUser })}
      {route.name === 'corretor'  && React.createElement(window.CorretorPage,  { onNav, authUser })}
      {route.name === 'fotografo' && React.createElement(window.FotografoPage, { onNav, authUser })}
      {route.name === 'sobre' && React.createElement(window.SobrePage, { onNav })}
      {route.name === 'proprietario'    && React.createElement(window.ProprietarioPage,    { onNav })}
      {route.name === 'corretor-canal'  && React.createElement(window.CorretorCanalPage,  { onNav })}
      {route.name === 'fotografo-canal' && React.createElement(window.FotografoCanalPage, { onNav })}
      {route.name === 'lancamentos' && React.createElement(window.LancamentosPage, { onNav })}
      {route.name === 'aluguel' && (
        <PlaceholderPage name="aluguel" onNav={onNav} />
      )}

      <SiteFooter onNav={onNav} />

      {/* WhatsApp flutuante global */}
      <a onClick={() => window.open('https://wa.me/5531984144250?text=' + encodeURIComponent('Olá! Vi a VN Prime Imóveis e gostaria de mais informações.'), '_blank')}
        style={{ position: 'fixed', bottom: 24, right: 24, zIndex: 400,
          width: 56, height: 56, borderRadius: '50%', background: '#25d366',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 8px 28px rgba(37,211,102,0.45)', cursor: 'pointer',
          fontSize: 26, textDecoration: 'none', transition: 'transform 0.2s, box-shadow 0.2s' }}
        onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.1)'; e.currentTarget.style.boxShadow = '0 12px 36px rgba(37,211,102,0.55)'; }}
        onMouseLeave={e => { e.currentTarget.style.transform = 'none'; e.currentTarget.style.boxShadow = '0 8px 28px rgba(37,211,102,0.45)'; }}
        title="Falar no WhatsApp">💬</a>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Layout">
          <TweakRadio label="Densidade" value={tweaks.density}
            options={[{value:'compact', label:'Compacto'}, {value:'comfortable', label:'Confortável'}]}
            onChange={(v) => setTweak('density', v)} />
        </TweakSection>
        <TweakSection title="Identidade">
          <TweakRadio label="Cor de destaque" value={tweaks.accentMode}
            options={[
              {value:'gold', label:'Dourado'},
              {value:'emerald', label:'Esmeralda'},
              {value:'bronze', label:'Bronze'},
            ]}
            onChange={(v) => setTweak('accentMode', v)} />
          <TweakSelect label="Fonte de display" value={tweaks.headlineFont}
            options={[
              {value:'Playfair Display', label:'Playfair Display (padrão)'},
              {value:'Cinzel', label:'Cinzel (mais luxo)'},
              {value:'DM Serif Display', label:'DM Serif Display'},
            ]}
            onChange={(v) => setTweak('headlineFont', v)} />
        </TweakSection>
        <TweakSection title="Navegação rápida">
          <TweakButton onClick={() => onNav('home')}>Home</TweakButton>
          <TweakButton onClick={() => onNav('busca')}>Busca</TweakButton>
          <TweakButton onClick={() => onNav('detalhe', { id: 'vn-4401' })}>Detalhe</TweakButton>
          <TweakButton onClick={() => onNav('vender')}>Vender hub</TweakButton>
          <TweakButton onClick={() => onNav('anunciar')}>Anunciar</TweakButton>
          <TweakButton onClick={() => onNav('portal')}>Portal proprietário</TweakButton>
          <TweakButton onClick={() => onNav('corretor')}>Portal corretor</TweakButton>
          <TweakButton onClick={() => onNav('fotografo')}>Portal fotógrafo</TweakButton>
          <TweakButton onClick={() => onNav('sobre')}>Sobre</TweakButton>
          <TweakButton onClick={() => onNav('lancamentos')}>Lançamentos</TweakButton>
          <TweakButton onClick={() => onNav('proprietario')}>Canal proprietário</TweakButton>
          <TweakButton onClick={() => onNav('corretor-canal')}>Canal corretor</TweakButton>
          <TweakButton onClick={() => onNav('fotografo-canal')}>Canal fotógrafo</TweakButton>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

function PlaceholderPage({ name, onNav }) {
  const labels = {
    aluguel: ['Imóveis para alugar', 'Veja nossos imóveis em aluguel na busca.'],
  };
  const [t, p] = labels[name] || ['Página', 'Em construção'];
  return (
    <main style={{ padding: '80px 20px', textAlign: 'center', minHeight: '60vh' }}>
      <Eyebrow color="var(--gold)">VN Prime · {name}</Eyebrow>
      <h1>{t}</h1>
      <p style={{ color: 'var(--fg-2)', maxWidth: 480, margin: '0 auto 24px' }}>{p}</p>
      <Btn variant="accent" onClick={() => onNav(name === 'aluguel' ? 'busca' : name === 'lancamentos' ? 'busca' : 'home',
        name === 'aluguel' ? { op: 'aluguel' } : name === 'lancamentos' ? { op: 'lancamento' } : {})}>
        {name === 'aluguel' || name === 'lancamentos' ? 'Ver imóveis' : 'Voltar para o início'}
      </Btn>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
