<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VN Prime Imóveis</title>
<style>
/* ==========================================================================
   VN Prime Imóveis — Colors & Type Tokens
   Display: Playfair Display  ·  Body: DM Sans  ·  Brand word: Cinzel
   ========================================================================== */

@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

:root {
  /* ---------- Brand base ---------- */
  --navy:            #0F2244;   /* Marinha — primary brand */
  --navy-soft:       #162A52;
  --navy-muted:      #1E3560;
  --gold:            #C9960E;   /* Dourado — accent */
  --gold-soft:       #D4A84A;
  --gold-bright:     #F5D78E;   /* gradient highlight */
  --gold-deep:       #A07830;   /* gradient shadow */

  /* ---------- Surfaces ---------- */
  --cream:           #FAF8F4;   /* off-white page bg */
  --white:           #FFFFFF;
  --surface:         #FFFFFF;
  --surface-alt:     #FAF8F4;

  /* ---------- Text ---------- */
  --fg-1:            #1A1A1A;   /* body */
  --fg-2:            #5C6478;   /* muted, secondary */
  --fg-3:            rgba(15, 34, 68, 0.55);
  --fg-on-navy:      #FAF8F4;
  --fg-on-navy-2:    rgba(250, 249, 246, 0.85);

  /* ---------- Borders ---------- */
  --border:          rgba(15, 34, 68, 0.12);
  --border-strong:   rgba(15, 34, 68, 0.22);

  /* ---------- Profile accents (adaptive UI) ---------- */
  --profile-owner:   #C9960E;   /* Proprietário — Ouro */
  --profile-broker:  #059669;   /* Corretor — Esmeralda */
  --profile-photo:   #B87333;   /* Fotógrafo — Bronze */
  --profile-admin:   #0F2244;   /* Administração — Marinho */

  /* ---------- Semantic status ---------- */
  --status-pending-bg:     #FEF3C7;
  --status-pending-fg:     #92400E;
  --status-approved-bg:    #D1FAE5;
  --status-approved-fg:    #065F46;
  --status-plan-bg:        #E0E7FF;
  --status-plan-fg:        #3730A3;

  /* ---------- Elevation ---------- */
  --shadow-card:     0 8px 32px rgba(15, 34, 68, 0.08);
  --shadow-soft:     0 18px 50px rgba(15, 34, 68, 0.12);
  --shadow-accent:   0 4px 24px rgba(201, 150, 14, 0.35);
  --shadow-navy:     0 4px 20px rgba(15, 34, 68, 0.25);
  --shadow-featured: 0 12px 40px rgba(201, 150, 14, 0.20);

  /* ---------- Radii ---------- */
  --radius-sm:       8px;
  --radius-md:       14px;
  --radius-lg:       22px;
  --radius-pill:     999px;

  /* ---------- Spacing scale ---------- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 2.5rem;
  --space-8: 3rem;

  /* ---------- Type families ---------- */
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:    "DM Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --font-brand:   "Cinzel", Georgia, serif;   /* VN PRIME wordmark only */

  /* ---------- Signature gradients ---------- */
  --gradient-gold:       linear-gradient(145deg,#F5D78E 0%,#C9A84C 45%,#A07830 62%,#C9A84C 100%);
  --gradient-gold-line:  linear-gradient(90deg,#B8892A,#D4A84A,#B8892A);
  --gradient-navy-hero:  linear-gradient(135deg,#0F2244 0%,#162A52 45%,#1E3560 100%);
  --gradient-navy-fact:  linear-gradient(90deg,#0F2244,#1E3560);

  /* ---------- Dynamic accent (profile-adaptive) ---------- */
  --accent:          var(--gold);
  --accent-contrast: var(--navy);
}

[data-profile="owner"]  { --accent: var(--profile-owner);  --accent-contrast: #0F2244; }
[data-profile="broker"] { --accent: var(--profile-broker); --accent-contrast: #FFFFFF; }
[data-profile="photo"]  { --accent: var(--profile-photo);  --accent-contrast: #0F2244; }
[data-profile="admin"]  { --accent: var(--profile-admin);  --accent-contrast: #C9960E; }

/* ============================================================
   Semantic type styles
   ============================================================ */

html { color-scheme: light; }

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--fg-1);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.2;
  color: var(--navy);
  margin: 0 0 0.5em;
}

h1 { font-size: clamp(2.25rem, 4vw, 3.25rem); }
h2 { font-size: clamp(1.75rem, 3vw, 2.35rem); }
h3 { font-size: 1.35rem; }
h4 { font-size: 1.1rem; }

p { margin: 0 0 1em; color: var(--fg-2); }

small, .text-xs { font-size: 0.75rem; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-soft);
}

.subsection-label {
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.label-caps {
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-2);
}

.lead {
  font-family: var(--font-body);
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--fg-2);
}

.price {
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--accent);
  margin: 0.5rem 0;
}

.muted { color: var(--fg-2); }

code {
  font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
  background: rgba(15, 34, 68, 0.06);
  padding: 0.1em 0.35em;
  border-radius: 4px;
}

/* Brand wordmark helper — VN PRIME only */
.wordmark-vn {
  font-family: var(--font-brand);
  font-weight: 700;
  letter-spacing: 0.05em;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.wordmark-prime {
  font-family: var(--font-brand);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--navy);
}
.wordmark-imoveis {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.58em;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  background: var(--gradient-gold-line);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

  * { box-sizing: border-box; }
  body { margin: 0; }
  input, select, textarea {
    font-family: 'DM Sans', sans-serif;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 0.85rem;
    background: var(--cream);
    color: var(--navy);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,150,14,0.18);
    background: #fff;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(15,34,68,0.18); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(15,34,68,0.32); }
  .kpi-cell:last-child { border-right: none !important; }
  a { color: inherit; }
  .vnp-nav-desktop { display: flex; }
  .vnp-hamburger   { display: none; }
  .vnp-drawer      { display: none; }
  @media (max-width: 767px) {
    .vnp-nav-desktop { display: none !important; }
    .vnp-hamburger   { display: flex !important; align-items: center; justify-content: center; }
    .vnp-drawer {
      display: block;
      position: fixed; inset: 0; top: 57px; z-index: 99;
      background: rgba(250,249,246,0.99);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      padding: 24px 20px 40px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .vnp-drawer.open { transform: translateX(0); }
  }
  .vnp-dropdown { position: relative; }
</style>
</head>

<script>
// ── Gerador de pitches VN Prime (template-based, funciona sem backend) ────────
window.claude = {
  complete: function(prompt) {
    return new Promise(function(resolve) {
      // Extrai dados do prompt
      var tipo      = (prompt.match(/Tipo:\s*(.+)/)       || [])[1] || 'Imóvel';
      var bairro    = (prompt.match(/Localização:\s*([^,\n]+)/) || [])[1]?.trim() || 'Belo Horizonte';
      var area      = (prompt.match(/Área:\s*(\d+)/)      || [])[1] || '';
      var quartos   = (prompt.match(/(\d+) quartos/)      || [])[1] || '';
      var suites    = (prompt.match(/(\d+) suítes/)       || [])[1] || '';
      var vagas     = (prompt.match(/(\d+) vagas/)        || [])[1] || '';
      var difRaw    = (prompt.match(/Diferenciais:\s*(.+)/) || [])[1] || '';
      var difs      = difRaw !== 'não informado' ? difRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
      var difStr    = difs.length ? difs.slice(0, 2).join(' e ').toLowerCase() : '';

      var areaStr   = area   ? area + ' m²'      : '';
      var qtosStr   = quartos ? quartos + (quartos === '1' ? ' quarto' : ' quartos') : '';
      var suitStr   = suites  ? suites  + (suites  === '1' ? ' suíte'  : ' suítes')  : '';
      var vagStr    = vagas   ? vagas   + (vagas   === '1' ? ' vaga'   : ' vagas')   : '';

      var specs = [areaStr, qtosStr, suitStr, vagStr].filter(Boolean).join(', ');

      var pitches = [
        {
          label: 'Curto e direto',
          text: tipo + ' de ' + (areaStr || 'alto padrão') + ' no ' + bairro + (specs ? ' — ' + specs : '') + '.' +
            (difStr ? ' Destaques: ' + difStr + '.' : '') +
            ' Curadoria VN Prime. Endereço completo disponível após contato qualificado.'
        },
        {
          label: 'Editorial e descritivo',
          text: 'Localizado no ' + bairro + ', este ' + tipo.toLowerCase() + (areaStr ? ' de ' + areaStr : '') +
            ' foi projetado para quem valoriza espaço e qualidade de acabamento.' +
            (specs ? ' São ' + [qtosStr, suitStr, vagStr].filter(Boolean).join(', ') + '.' : '') +
            (difStr ? ' Entre os diferenciais: ' + difStr + '.' : '') +
            ' Disponibilidade e visita mediante agendamento pelo portal VN Prime.'
        },
        {
          label: 'Foco em estilo de vida',
          text: bairro + ' é um dos bairros mais valorizados de BH — e este ' + tipo.toLowerCase() +
            (areaStr ? ' de ' + areaStr : '') + ' está no coração dele.' +
            (difStr ? ' ' + difStr.charAt(0).toUpperCase() + difStr.slice(1) + ' fazem parte do dia a dia.' : '') +
            (qtosStr ? ' ' + qtosStr.charAt(0).toUpperCase() + qtosStr.slice(1) + (suitStr ? ', sendo ' + suitStr : '') + '.' : '') +
            ' Para quem busca referência sem abrir mão de conforto.'
        }
      ];

      // Simula delay realista de 2.5s
      setTimeout(function() {
        resolve(JSON.stringify({ pitches: pitches }));
      }, 2500);
    });
  }
};
</script>
